<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="driver_profile_title">PaddockIntel — Perfil de Piloto</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e10600'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='18' fill='white'>PI</text></svg>" />
  
  <link rel="stylesheet" href="public/css/styles.css" />
  <link rel="stylesheet" href="public/css/driver.css" />
</head>
<body>
  <div class="app-container">

    <header class="site-header">
      <div class="logo-group">
        <div class="logo-badge">PI</div>
        <div>
          <div class="logo-text">Paddock<span>Intel</span></div>
          <div class="logo-sub" data-i18n="driver_economic_profile">Driver Economic Profile</div>
        </div>
      </div>
      <div class="header-right">
        <div class="lang-selector">
          <button onclick="setLanguage('es')" class="lang-btn" id="btn-lang-es">🇪🇸 ES</button>
          <button onclick="setLanguage('en')" class="lang-btn" id="btn-lang-en">🇺🇸 EN</button>
        </div>
        <button onclick="window.location.href='index.html'" class="back-dashboard-btn" data-i18n="back_dashboard">← Dashboard</button>
      </div>
    </header>

    <div class="driver-hero-grid">
      <div class="glass-card driver-main-card">
        <div id="driver-loading-state" class="profile-loading">
          <div class="spinner"></div>
          <p data-i18n="loading_driver">Loading driver profile...</p>
        </div>
        
        <div id="driver-profile-content" style="display: none;">
          </div>
      </div>
    </div>

    <div class="dashboard-grid driver-details-grid">
      
      <div class="glass-card performance-card">
        <div class="sidebar-card-header">
          <span class="sidebar-card-title" data-i18n="season_results_title">2026 Results</span>
          <span class="section-tag" data-i18n="by_race_tag">By Race</span>
        </div>
        <div id="driver-results-table">
          <div class="loading-state"><div class="spinner"></div><span data-i18n="loading_records">Loading records...</span></div>
        </div>
      </div>

      <div class="glass-card economics-card">
        <div class="sidebar-card-header">
          <span class="sidebar-card-title" data-i18n="economic_intel_title">Economic Intelligence</span>
          <span class="section-tag gold">PaddockIntel Metrics</span>
        </div>
        <div id="driver-economics-content">
          <div class="loading-state"><div class="spinner"></div><span data-i18n="loading_economics">Loading economics data...</span></div>
        </div>
      </div>

    </div>

    <footer class="site-footer">
      <div>© 2026 <a href="https://paddockintel.com" class="footer-link" target="_blank">PaddockIntel</a> · <span data-i18n="footer_intel">F1 Economic Intelligence</span></div>
      <div data-i18n="footer_credits">Data: Jolpica F1 · OpenF1 · Salary estimates via public reporting</div>
      <div>
        <button onclick="window.location.href='index.html'" class="footer-back-link" data-i18n="back_dashboard">Back to Dashboard</button>
      </div>
    </footer>

  </div>

  <script src="public/js/i18n.js"></script>
  <script src="public/js/f1-drivers.js"></script> 
  <script src="public/js/driver.js"></script>
</body>
</html>
