<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Hub — PaddockIntel Cinematic</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e10600'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='18' fill='white'>PI</text></svg>" />
    
    <style>
        /* ═══ CONSOLA DE TELEMETRÍA VERTICAL ABSOLUTA (Format 9:16) ═══ */
        :root {
            --phone-width: 405px;
            --phone-height: 720px;
            --m-teal: #27F4D2;
            --r-blue: #3671C6;
            --f-red: #E8002D;
            --m-orange: #FF8000;
        }

        body {
            background-color: #040507; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Chasis Contenedor del Smartphone */
        .cinematic-container {
            width: var(--phone-width);
            height: var(--phone-height);
            background: #0b0d10;
            position: relative;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 0 12px #16181d;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* HUD Superior de Transmisión */
        .ui-top {
            padding: 32px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(to bottom, #0b0d10 60%, transparent);
            z-index: 100;
        }

        .race-header h1 {
            color: #ffffff;
            font-size: 18px;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .race-header p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #6c6f78;
            margin: 2px 0 0;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .pi-badge {
            background: #e10600;
            color: #ffffff;
            font-weight: 900;
            padding: 3px 7px;
            border-radius: 5px;
            font-size: 10px;
            box-shadow: 0 0 12px rgba(225, 6, 0, 0.3);
        }

        /* Área de Renderizado de Pista (Ajustada para prevenir desbordes) */
        .render-canvas {
            flex-grow: 1;
            width: 100%;
            height: 320px; /* Altura controlada para blindar el UX */
            position: relative;
            background: radial-gradient(circle at 50% 50%, #11141a 0%, #0b0d10 100%);
            overflow: hidden;
        }

        #cinematic-circuit-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .circuit-vector-path {
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 6;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .circuit-active-glow {
            stroke-width: 6;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.25;
        }

        /* Monoplazas en el Radar Vectorial */
        .svg-driver-node circle {
            stroke: #ffffff;
            stroke-width: 1.8;
            transition: transform 0.05s linear;
        }

        .svg-driver-node text {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: 8px;
            fill: #ffffff;
        }

        /* HUD Inferior de Control de Mandos (Totalmente Blindado) */
        .ui-bottom {
            background: #050608;
            padding: 16px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.02);
        }

        .chrono-main {
            font-family: 'JetBrains Mono', monospace;
            color: #ffffff;
            font-size: 34px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .chrono-main span {
            color: #40434c;
            font-size: 20px;
        }

        /* Torre de Tiempos Miniaturizada */
        .leaderboard-mini {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .mini-card {
            background: rgba(255,255,255,0.02);
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.01);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mini-card .left-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-card .rank {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            color: #484b52;
        }

        .mini-card .name {
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .mini-card .gap {
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            font-weight: 600;
        }

        /* Botón Maestro de Lanzamiento */
        .btn-play-cinematic {
            width: 100%;
            background: #ffffff;
            color: #050608;
            border: none;
            padding: 12px;
            font-size: 12.5px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255,255,255,0.1);
            transition: transform 0.2s, background 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .btn-play-cinematic:hidden { display: none; }
        .btn-play-cinematic:active { transform: scale(0.98); background: #e5e5e5; }

        .btn-back {
            text-align: center;
            color: #3d4047;
            text-decoration: none;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .btn-back:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="cinematic-container">
        
        <div class="ui-top">
            <div class="race-header">
                <p>Análisis de Carrera · Vuelta 1</p>
                <h1>MIAMI GRAND PRIX</h1>
            </div>
            <div class="pi-badge">PI</div>
        </div>

        <div class="render-canvas">
            <svg id="cinematic-circuit-svg" viewBox="0 0 300 500">
                <path id="miami-vertical-path" class="circuit-vector-path" 
                    d="M 150,440 C 40,440 25,330 35,260 C 45,160 115,120 150,60 C 185,10 265,20 265,130 C 265,250 185,300 150,360 C 105,410 260,440 150,440 Z" />
                
                <path id="active-glow-path" class="circuit-active-glow" style="stroke: var(--m-teal);"
                    d="M 150,440 C 40,440 25,330 35,260 C 45,160 115,120 150,60 C 185,10 265,20 265,130 C 265,250 185,300 150,360 C 105,410 260,440 150,440 Z" />

                <g id="svg-node-antonelli" class="svg-driver-node"><circle r="10" fill="var(--m-teal)" /><text text-anchor="middle" dominant-baseline="central">ANT</text></g>
                <g id="svg-node-verstappen" class="svg-driver-node"><circle r="10" fill="var(--r-blue)" /><text text-anchor="middle" dominant-baseline="central">VER</text></g>
                <g id="svg-node-norris" class="svg-driver-node"><circle r="10" fill="var(--m-orange)" /><text text-anchor="middle" dominant-baseline="central">NOR</text></g>
                <g id="svg-node-hamilton" class="svg-driver-node"><circle r="10" fill="var(--f-red)" /><text text-anchor="middle" dominant-baseline="central">HAM</text></g>
                <g id="svg-node-leclerc" class="svg-driver-node"><circle r="10" fill="var(--f-red)" /><text text-anchor="middle" dominant-baseline="central">LEC</text></g>
            </svg>
        </div>

        <div class="ui-bottom">
            <div class="chrono-main" id="cinematic-chrono">00:00<span>.000</span></div>
            
            <div class="leaderboard-mini" id="web-mini-tower">
                </div>
            
            <button id="btn-trigger-cinematic" class="btn-play-cinematic">
                ▶ ASÍ FUE LA VUELTA 1
            </button>
            
            <a href="index.html" class="btn-back">← Volver al Dashboard</a>
        </div>
    </div>

    <script>
        const telemetryDB = {
            durationSeconds: 30,
            realLapTimeSeconds: 96.280,
            drivers: {
                "antonelli":  { name: "K. Antonelli",  code: "ANT", color: "var(--m-teal)" },
                "verstappen": { name: "M. Verstappen", code: "VER", color: "var(--r-blue)" },
                "norris":      { name: "L. Norris",     code: "NOR", color: "var(--m-orange)" },
                "hamilton":    { name: "L. Hamilton",   code: "HAM", color: "var(--f-red)" },
                "leclerc":     { name: "C. Leclerc",    code: "LEC", color: "var(--f-red)" }
            },
            timeline: [
                { progress: 0.0,  order: ["verstappen", "antonelli", "leclerc", "norris", "hamilton"], gaps: [0.0, 0.120, 0.310, 0.490, 0.650] },
                { progress: 0.33, order: ["verstappen", "antonelli", "norris", "leclerc", "hamilton"], gaps: [0.0, 0.410, 1.080, 1.420, 1.950] },
                { progress: 0.66, order: ["antonelli", "verstappen", "norris", "hamilton", "leclerc"], gaps: [0.0, 0.220, 1.610, 2.150, 2.580] },
                { progress: 1.0,  order: ["antonelli", "verstappen", "norris", "hamilton", "leclerc"], gaps: [0.0, 0.600, 2.100, 2.800, 3.400] }
            ]
        };

        document.addEventListener("DOMContentLoaded", () => {
            const svg = document.getElementById("cinematic-circuit-svg");
            const trackPath = document.getElementById("miami-vertical-path");
            const glowPath = document.getElementById("active-glow-path");
            const chronoEl = document.getElementById("cinematic-chrono");
            const towerEl = document.getElementById("web-mini-tower");
            const actionBtn = document.getElementById("btn-trigger-cinematic");

            let animationId = null;
            let startTime = null;
            let isRunning = false;
            let progress = 0;

            const pathLength = trackPath.getTotalLength();
            const totalDurationMs = telemetryDB.durationSeconds * 1000;

            glowPath.style.strokeDasharray = pathLength;
            glowPath.style.strokeDashoffset = pathLength;

            // Algoritmo de interpolación lineal ultra-seguro por piloto
            function getDriverState(driverId, currentProgress) {
                const timeline = telemetryDB.timeline;
                let prev = timeline[0];
                let next = timeline[timeline.length - 1];

                for (let i = 0; i < timeline.length; i++) {
                    if (timeline[i].progress <= currentProgress) prev = timeline[i];
                    if (timeline[i].progress >= currentProgress) { next = timeline[i]; break; }
                }

                const prevIdx = prev.order.indexOf(driverId);
                const nextIdx = next.order.indexOf(driverId);
                const prevGap = prev.gaps[prevIdx];
                const nextGap = next.gaps[nextIdx];

                let factor = 0;
                if (next.progress !== prev.progress) {
                    factor = (currentProgress - prev.progress) / (next.progress - prev.progress);
                }

                const gap = prevGap + (nextGap - prevGap) * factor;
                const activeOrder = currentProgress >= next.progress ? next.order : prev.order;
                const rank = activeOrder.indexOf(driverId) + 1;

                return { gap, rank };
            }

            function loop(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed >= totalDurationMs) {
                    progress = 1.0;
                    renderFrame(1.0);
                    chronoEl.innerHTML = `01:36<span>.280</span>`;
                    actionBtn.textContent = "▶ ASÍ FUE LA VUELTA 1";
                    isRunning = false;
                    startTime = null;
                    return;
                }

                progress = elapsed / totalDurationMs;
                renderFrame(progress);

                // Reloj oficial digital
                const currentRealSeconds = progress * telemetryDB.realLapTimeSeconds;
                const mins = Math.floor(currentRealSeconds / 60);
                const secs = Math.floor(currentRealSeconds % 60);
                const mils = Math.floor((currentRealSeconds % 1) * 1000);
                chronoEl.innerHTML = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}<span>.${String(mils).padStart(3,'0')}</span>`;

                animationId = requestAnimationFrame(loop);
            }

            function renderFrame(currentProgress) {
                const driverIds = Object.keys(telemetryDB.drivers);
                const leaderDist = currentProgress * pathLength;
                glowPath.style.strokeDashoffset = pathLength - leaderDist;

                let sumX = 0, sumY = 0, count = 0;
                const currentRankings = [];

                driverIds.forEach(id => {
                    const node = document.getElementById(`svg-node-${id}`);
                    if (!node) return;

                    const state = getDriverState(id, currentProgress);
                    
                    // Separación elástica en píxeles según la distancia al P1
                    let driverDist = leaderDist - (state.gap * 28);
                    if (driverDist < 0) driverDist = 0;

                    const pt = trackPath.getPointAtLength(driverDist % pathLength);
                    node.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);

                    sumX += pt.x;
                    sumY += pt.y;
                    count++;

                    currentRankings.push({ id, rank: state.rank, gap: state.gap });
                });

                // Reordenar torre según el orden real actual
                currentRankings.sort((a, b) => a.rank - b.rank);

                // 🛠️ MOVIMIENTO DE CÁMARA HELICÓPTERO DINÁMICO
                if (currentProgress > 0.001 && count > 0) {
                    const avgX = sumX / count;
                    const avgY = sumY / count;
                    
                    // Zoom dinámico de recuadro
                    const camWidth = 140; 
                    const camHeight = 220;
                    svg.setAttribute("viewBox", `${avgX - camWidth/2} ${avgY - camHeight/2} ${camWidth} ${camHeight}`);
                } else {
                    // Vista completa de parrilla antes del semáforo
                    svg.setAttribute("viewBox", "0 0 300 500");
                }

                // Inyectar Filas en la Torre
                towerEl.innerHTML = "";
                currentRankings.slice(0, 4).forEach(item => {
                    const driver = telemetryDB.drivers[item.id];
                    const gapText = item.rank === 1 ? "LEADER" : `+${item.gap.toFixed(3)}s`;
                    towerEl.innerHTML += `
                        <div class="mini-card" style="border-left: 4px solid ${driver.color}">
                            <div class="left-info">
                                <span class="rank">P${item.rank}</span>
                                <span class="name">${driver.name.toUpperCase()}</span>
                            </div>
                            <span class="gap">${gapText}</span>
                        </div>
                    `;
                });
            }

            actionBtn.addEventListener("click", () => {
                if (isRunning) {
                    cancelAnimationFrame(animationId);
                    actionBtn.textContent = "▶ ASÍ FUE LA VUELTA 1";
                    isRunning = false;
                    startTime = null;
                } else {
                    isRunning = true;
                    actionBtn.textContent = "⏸ PAUSAR TELEMETRÍA";
                    animationId = requestAnimationFrame(loop);
                }
            });

            // Forzar renderizado en frío (Vuelta 0)
            renderFrame(0.0);
        });
    </script>
</body>
</html>
