<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Hub — PaddockIntel Cinematic</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e10600'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='18' fill='white'>PI</text></svg>" />
    
    <style>
        /* ═══ MAQUETACIÓN CINEMÁTICA VERTICAL (Format 9:16) ═══ */
        :root {
            --phone-width: 405px;
            --phone-height: 720px;
        }

        body {
            background-color: #050608; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor espejo de Smartphone Premium */
        .cinematic-container {
            width: var(--phone-width);
            height: var(--phone-height);
            background: #0d0f12;
            position: relative;
            box-shadow: 0 25px 70px rgba(0,0,0,0.8), 0 0 0 12px #191b20;
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Capa Superior de Información HUD */
        .ui-top {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            padding: 0 24px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .race-header h1 {
            color: #ffffff;
            font-size: 19px;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .race-header p {
            font-family: var(--font-mono);
            font-size: 10px;
            color: #8a8d98;
            margin: 2px 0 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .pi-badge {
            background: var(--f1-red);
            color: #fff;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            box-shadow: 0 2px 8px rgba(225,6,0,0.4);
        }

        /* Área de Renderizado del Circuito */
        .render-canvas {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #13161c 0%, #0d0f12 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cinematic-circuit-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            transition: viewBox 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .circuit-vector-path {
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 6;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .circuit-active-glow {
            stroke-width: 6;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.4;
        }

        .svg-driver-node circle {
            stroke: #ffffff;
            stroke-width: 2;
        }

        .svg-driver-node text {
            font-family: var(--font-mono);
            font-weight: 900;
            font-size: 8.5px;
            fill: #ffffff;
        }

        /* Panel Inferior Rediseñado (Safe Zone) */
        .ui-bottom {
            background: linear-gradient(to top, #050608 85%, transparent 100%);
            padding: 20px 24px 40px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-sizing: border-box;
        }

        .chrono-main {
            font-family: var(--font-mono);
            color: #ffffff;
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
            margin: 0;
            padding: 0;
        }

        .chrono-main span {
            color: #4b4e57;
            font-size: 22px;
        }

        /* Mini Torre de Tiempos Vertical */
        .leaderboard-mini {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 120px;
        }

        .mini-card {
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.01);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mini-card .left-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mini-card .rank {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            color: #5c5f66;
        }

        .mini-card .name {
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
        }

        .mini-card .gap {
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
        }

        .btn-back {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: #44474f;
            text-decoration: none;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            z-index: 110;
            text-transform: uppercase;
        }
        .btn-back:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="cinematic-container">
        
        <div class="ui-top">
            <div class="race-header">
                <p>FORMULA 1 · VUELTA 1</p>
                <h1>MIAMI GRAND PRIX</h1>
            </div>
            <div class="pi-badge">PI</div>
        </div>

        <div class="render-canvas">
            <svg id="cinematic-circuit-svg" viewBox="0 0 300 500">
                <path id="miami-vertical-path" class="circuit-vector-path" 
                    d="M 150,430 C 30,430 20,320 30,250 C 40,150 110,110 150,50 C 190,10 270,20 270,130 C 270,250 190,300 150,350 C 100,400 270,430 150,430 Z" />
                
                <path id="active-glow-path" class="circuit-active-glow" style="stroke: #27F4D2;"
                    d="M 150,430 C 30,430 20,320 30,250 C 40,150 110,110 150,50 C 190,10 270,20 270,130 C 270,250 190,300 150,350 C 100,400 270,430 150,430 Z" />

                <g id="svg-node-verstappen" class="svg-driver-node">
                    <circle r="11" fill="#3671C6" />
                    <text text-anchor="middle" dominant-baseline="central">VER</text>
                </g>
                <g id="svg-node-antonelli" class="svg-driver-node">
                    <circle r="11" fill="#27F4D2" />
                    <text text-anchor="middle" dominant-baseline="central">ANT</text>
                </g>
                <g id="svg-node-norris" class="svg-driver-node">
                    <circle r="11" fill="#FF8000" />
                    <text text-anchor="middle" dominant-baseline="central">NOR</text>
                </g>
                <g id="svg-node-hamilton" class="svg-driver-node">
                    <circle r="11" fill="#E8002D" />
                    <text text-anchor="middle" dominant-baseline="central">HAM</text>
                </g>
                <g id="svg-node-leclerc" class="svg-driver-node">
                    <circle r="11" fill="#E8002D" />
                    <text text-anchor="middle" dominant-baseline="central">LEC</text>
                </g>
            </svg>
        </div>

        <div class="ui-bottom">
            <div class="chrono-main" id="cinematic-chrono">00:00<span>.000</span></div>
            
            <div class="leaderboard-mini" id="web-mini-tower"></div>
            
            <button id="btn-trigger-cinematic" class="sim-action-btn" style="width: 100%; padding: 14px; font-size: 13px; background: #ffffff; color: #090b0e; font-weight: 800; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(255,255,255,0.1);">
                ▶ ASÍ FUE LA VUELTA 1
            </button>
        </div>

        <a href="index.html" class="btn-back">← Volver al Dashboard</a>
    </div>

    <script>
        // DATA MATRIX INTEGRADA PARA ELIMINAR ASYNC BUGS
        const miamiTelemetryMatrix = {
            simulationDurationSeconds: 30,
            realLapTimeSeconds: 96.280,
            drivers: {
                "verstappen": { name: "M. Verstappen", code: "VER", color: "#3671C6" },
                "antonelli":  { name: "K. Antonelli",  code: "ANT", color: "#27F4D2" },
                "leclerc":     { name: "C. Leclerc",    code: "LEC", color: "#E8002D" },
                "norris":      { name: "L. Norris",     code: "NOR", color: "#FF8000" },
                "hamilton":    { name: "L. Hamilton",   code: "HAM", color: "#E8002D" }
            },
            timeline: [
                { progress: 0.0,  order: ["verstappen", "antonelli", "leclerc", "norris", "hamilton"], gaps: [0.0, 0.15, 0.32, 0.50, 0.68] },
                { progress: 0.33, order: ["verstappen", "antonelli", "norris", "leclerc", "hamilton"], gaps: [0.0, 0.42, 1.12, 1.55, 2.10] },
                { progress: 0.66, order: ["antonelli", "verstappen", "norris", "hamilton", "leclerc"], gaps: [0.0, 0.25, 1.82, 2.44, 2.91] },
                { progress: 1.0,  order: ["antonelli", "verstappen", "norris", "hamilton", "leclerc"], gaps: [0.0, 0.61, 2.14, 2.85, 3.40] }
            ]
        };

        document.addEventListener("DOMContentLoaded", () => {
            const data = miamiTelemetryMatrix;

            const svg = document.getElementById("cinematic-circuit-svg");
            const trackPath = document.getElementById("miami-vertical-path");
            const glowPath = document.getElementById("active-glow-path");
            const chronoEl = document.getElementById("cinematic-chrono");
            const towerEl = document.getElementById("web-mini-tower");
            const actionBtn = document.getElementById("btn-trigger-cinematic");

            let animationId = null;
            let startTime = null;
            let isRunning = false;
            let currentProgress = 0;
            
            const totalLength = trackPath.getTotalLength();
            const durationMs = data.simulationDurationSeconds * 1000;

            glowPath.style.strokeDasharray = totalLength;
            glowPath.style.strokeDashoffset = totalLength;

            function getFrameData(progress) {
                let prev = data.timeline[0];
                let next = data.timeline[data.timeline.length - 1];

                for (let i = 0; i < data.timeline.length; i++) {
                    if (data.timeline[i].progress <= progress) prev = data.timeline[i];
                    if (data.timeline[i].progress >= progress) { next = data.timeline[i]; break; }
                }

                if (prev.progress === next.progress) return { order: prev.order, gaps: prev.gaps };
                
                const factor = (progress - prev.progress) / (next.progress - prev.progress);
                const currentGaps = {};
                
                prev.order.forEach((driverId, idx) => {
                    const prevGap = prev.gaps[idx];
                    const nextIdx = next.order.indexOf(driverId);
                    const nextGap = nextIdx !== -1 ? next.gaps[nextIdx] : prevGap;
                    currentGaps[driverId] = prevGap + (nextGap - prevGap) * factor;
                });

                const sortedDrivers = Object.keys(currentGaps).sort((a,b) => currentGaps[a] - currentGaps[b]);
                return {
                    order: sortedDrivers,
                    gaps: sortedDrivers.map(id => currentGaps[id])
                };
            }

            function loop(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed >= durationMs) {
                    // Fin de la vuelta: fijar estados finales
                    renderTimelineFrame(1.0);
                    chronoEl.innerHTML = `01:36<span>.280</span>`;
                    actionBtn.textContent = "▶ ASÍ FUE LA VUELTA 1";
                    isRunning = false;
                    startTime = null; // PERMITE REINICIAR AL DAR CLIC NUEVAMENTE
                    return;
                }

                currentProgress = elapsed / durationMs;
                renderTimelineFrame(currentProgress);

                // Reloj digital de carrera
                const currentRealSeconds = currentProgress * data.realLapTimeSeconds;
                const mins = Math.floor(currentRealSeconds / 60);
                const secs = Math.floor(currentRealSeconds % 60);
                const mils = Math.floor((currentRealSeconds % 1) * 1000);
                chronoEl.innerHTML = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}<span>.${String(mils).padStart(3,'0')}</span>`;

                animationId = requestAnimationFrame(loop);
            }

            function renderTimelineFrame(progress) {
                const frame = getFrameData(progress);
                const pathLength = trackPath.getTotalLength();
                
                const leaderDist = progress * pathLength;
                glowPath.style.strokeDashoffset = pathLength - leaderDist;

                let sumX = 0, sumY = 0, activeCount = 0;

                frame.order.forEach((driverId, index) => {
                    const node = document.getElementById(`svg-node-${driverId}`);
                    if (!node) return;

                    const gap = frame.gaps[index];
                    let driverDist = leaderDist - (gap * 22); // Factor elástico de distancia
                    if (driverDist < 0) driverDist = 0;

                    const pt = trackPath.getPointAtLength(driverDist % pathLength);
                    node.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);

                    sumX += pt.x;
                    sumY += pt.y;
                    activeCount++;
                });

                // CÁMARA HELICÓPTERO (Paneo Dinámico del viewBox)
                if (progress > 0.001 && activeCount > 0) {
                    const avgX = sumX / activeCount;
                    const avgY = sumY / activeCount;
                    
                    const camWidth = 160; 
                    const camHeight = 260;
                    const viewBoxX = avgX - (camWidth / 2);
                    const viewBoxY = avgY - (camHeight / 2);

                    svg.setAttribute("viewBox", `${viewBoxX} ${viewBoxY} ${camWidth} ${camHeight}`);
                } else {
                    // Vista global estática en la grilla antes de arrancar
                    svg.setAttribute("viewBox", "0 0 300 500");
                }

                // Actualizar torre de tiempos
                towerEl.innerHTML = "";
                frame.order.slice(0, 4).forEach((driverId, index) => {
                    const driver = data.drivers[driverId];
                    const gap = frame.gaps[index];
                    const gapText = index === 0 ? "LEADER" : `+${gap.toFixed(3)}s`;

                    towerEl.innerHTML += `
                        <div class="mini-card" style="border-left: 4px solid ${driver.color}">
                            <div class="left-info">
                                <span class="rank">P${index + 1}</span>
                                <span class="name">${driver.name.toUpperCase()}</span>
                            </div>
                            <span class="gap">${gapText}</span>
                        </div>
                    `;
                });
            }

            function resetSimulation() {
                cancelAnimationFrame(animationId);
                isRunning = false;
                startTime = null;
                currentProgress = 0;
                actionBtn.textContent = "▶ ASÍ FUE LA VUELTA 1";
                chronoEl.innerHTML = `00:00<span>.000</span>`;
                svg.setAttribute("viewBox", "0 0 300 500");
                glowPath.style.strokeDashoffset = totalLength;
                renderTimelineFrame(0.0);
            }

            actionBtn.addEventListener("click", () => {
                if (isRunning) {
                    cancelAnimationFrame(animationId);
                    actionBtn.textContent = "▶ ASÍ FUE LA VUELTA 1";
                    isRunning = false;
                    startTime = null; 
                } else {
                    isRunning = true;
                    actionBtn.textContent = "⏸ PAUSE ANALYTICS";
                    animationId = requestAnimationFrame(loop);
                }
            });

            resetSimulation();
        });
    </script>
</body>
</html>
