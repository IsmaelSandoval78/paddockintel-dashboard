name: Deploy preview to Cloudflare (manual)

# Deploys whichever branch this is dispatched against to the SEPARATE preview
# Worker (paddockintel-dashboard-preview / paddockintel-isr-cache-preview R2),
# never to the production Worker or hub.paddockintel.com. Reachable at its
# free *.workers.dev URL — no DNS/custom-domain changes, no crons (see
# wrangler.preview.jsonc's own comment for why crons are deliberately
# omitted: a preview build must never fire the real digest-send or
# beagle-refresh schedules).
#
# Manual only (workflow_dispatch) — run it from a branch when you actually
# want a real-data preview of it, same idea as deploy-cloudflare.yml but
# pointed at the preview target instead of production.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write build-time env (same as prod's deploy-cloudflare.yml — consumed by scripts/cloudflare-build.sh, never logged)
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          DRAFT_SECRET=${{ secrets.DRAFT_SECRET }}
          EOF

      - name: Build for Cloudflare (secrets stripped before packaging)
        run: bash scripts/cloudflare-build.sh

      - name: Deploy preview Worker
        # No --rclone here (unlike prod's deploy-cloudflare.yml): the existing
        # R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY token is scoped to production's
        # paddockintel-isr-cache bucket only (confirmed via a 403 AccessDenied
        # against paddockintel-isr-cache-preview, 2026-09-21) — correct behavior
        # for a minimally-scoped token per docs/advisors/CYBERSECURITY-EXPERT.md,
        # not a bug to route around by widening it. --rclone only eagerly
        # pre-populates the incremental cache; without it the Worker still runs
        # fine and populates its own cache on demand as routes render, which is
        # fine for a preview whose job is visual review, not cache-warm perf.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy --config wrangler.preview.jsonc

      - name: Set preview Worker runtime secrets (idempotent — same values every run, never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.preview.jsonc
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY --config wrangler.preview.jsonc
          echo "${{ secrets.CRON_SECRET }}" | npx wrangler secret put CRON_SECRET --config wrangler.preview.jsonc
          echo "${{ secrets.DRAFT_SECRET }}" | npx wrangler secret put DRAFT_SECRET --config wrangler.preview.jsonc

      - name: Remove build-time env file
        if: always()
        run: rm -f .env.local .env.local.cloudflare-build-bak

      - name: Preview URL
        run: echo "Preview live at https://paddockintel-dashboard-preview.<your-workers-dev-subdomain>.workers.dev — exact URL shown in the wrangler deploy step above."
