#!/usr/bin/env python3
"""
PaddockIntel — generate-constructors.py
Converts Ergast CSVs → src/data/f1-constructors.js

Run:  python3 scripts/generate-constructors.py
Auto: triggered by GitHub Actions on CSV push
"""

import csv
import json
import os

# ── Paths ────────────────────────────────────────────────────
BASE     = os.path.join(os.path.dirname(__file__), '..', 'src', 'data')
OUT_FILE = os.path.join(BASE, 'f1-constructors.js')

CSV_CONSTRUCTORS = os.path.join(BASE, 'constructors.csv')
CSV_STANDINGS    = os.path.join(BASE, 'constructor_standings.csv')
CSV_RESULTS      = os.path.join(BASE, 'constructor_results.csv')

# ── 2026 Grid metadata ────────────────────────────────────────
# Update chassis/engine/principal each season as needed
TEAMS_2026 = {
    '1':   {
        'ref': 'mclaren', 'name': 'McLaren', 'color': '#FF8000',
