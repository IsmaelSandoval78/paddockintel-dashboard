name: Generate f1-constructors.js from CSV

on:
  push:
    paths:
      - 'data/constructors.csv'
      - 'data/constructor_standings.csv'
      - 'data/constructor_results.csv'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run generator script
        run: python3 scripts/generate-constructors.py

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/js/f1-constructors.js
          git diff --staged --quiet || git commit -m "auto: regenerate f1-constructors.js from CSV"
          git push