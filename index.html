<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Data Hub — PaddockIntel</title>
<meta name="description" content="76 seasons of Formula 1 data. Interactive 2026 calendar, driver records, constructor history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f5f5f7;--white:#ffffff;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.04);
  --red:#e10600;--gold:#b8860b;--gold2:#d4a017;
  --text:#1a1a1a;--text2:#4a4a4a;--muted:#8a8a8a;
  --mono:'Share Tech Mono',monospace;--head:'Barlow Condensed',sans-serif;--body:'Rajdhani',sans-serif;
  --topbar-h:52px;--bottom-nav-h:60px;--radius:8px;
  --shadow:0 1px 4px rgba(0,0,0,0.06),0 2px 12px rgba(0,0,0,0.04);
  --shadow-lg:0 4px 24px rgba(0,0,0,0.10),0 8px 40px rgba(0,0,0,0.06);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;}
#topbar{position:fixed;top:0;left:0;right:0;z-index:500;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(0,0,0,.05),0 2px 12px rgba(0,0,0,.05);display:flex;align-items:center;padding:0 16px;gap:12px;}
.tb-logo{display:flex;align-items:center;gap:8px;text-decoration:none;border-right:1px solid var(--border);padding-right:12px;height:100%;flex-shrink:0;}
.tb-logo img{height:18px;width:auto;}
.tb-section{font-family:var(--mono);font-size:.58rem;color:#888;letter-spacing:.08em;flex-shrink:0;}
.tb-section::before{content:'//';color:var(--red);margin-right:6px;}
.tb-nav{display:flex;gap:2px;margin-left:4px;}
.tb-tab{font-family:var(--head);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;padding:0 12px;height:var(--topbar-h);display:flex;align-items:center;cursor:pointer;color:#666;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap;text-decoration:none;}
.tb-tab:hover{color:#1a1a1a;background:rgba(0,0,0,.02);}
.tb-tab.active{color:var(--red);border-bottom-color:var(--red);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.lang-toggle{display:flex;gap:1px;background:rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.1);border-radius:4px;overflow:hidden;}
.lang-btn{font-family:var(--mono);font-size:.62rem;padding:4px 9px;cursor:pointer;color:#777;transition:all .15s;letter-spacing:.06em;}
.lang-btn.active{color:#fff;background:var(--red);}
.tb-back{font-family:var(--mono);font-size:.62rem;color:#666;text-decoration:none;padding:4px 10px;border:1px solid rgba(0,0,0,.12);border-radius:3px;white-space:nowrap;display:none;}
.tb-back:hover{color:#1a1a1a;}
.tb-hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;padding:6px;border-radius:4px;background:transparent;border:none;}
.tb-hamburger span{display:block;width:20px;height:2px;background:#1a1a1a;border-radius:2px;transition:all .2s;}
#mobile-menu{position:fixed;top:var(--topbar-h);left:0;right:0;background:#fff;border-bottom:1px solid var(--border);z-index:400;transform:translateY(-100%);opacity:0;transition:all .25s ease;pointer-events:none;}
#mobile-menu.open{transform:translateY(0);opacity:1;pointer-events:all;}
.mm-item{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border2);cursor:pointer;font-family:var(--head);font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:#333;text-decoration:none;}
.mm-item:hover{background:rgba(225,6,0,.03);color:var(--red);}
.mm-item.active{color:var(--red);}
.mm-icon{font-size:1.1rem;width:24px;text-align:center;}
#app{display:flex;flex-direction:column;height:100vh;padding-top:var(--topbar-h);}
#main{flex:1;display:flex;overflow:hidden;position:relative;min-height:0;}
#map-view{display:flex;width:100%;height:100%;position:relative;}
#drivers-view{display:none;flex-direction:column;width:100%;height:100%;overflow:hidden;background:var(--bg);}
#drivers-view.active{display:flex;}
#constructors-view{display:none;flex-direction:column;width:100%;height:100%;overflow:hidden;background:var(--bg);}
#constructors-view.active{display:flex;}
#map-container{position:absolute;inset:0;z-index:1;}
#leaflet-map{width:100%;height:100%;}
.leaflet-container{background:#e8e8e8!important;}
.marker-wrap{position:relative;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.marker-ring{position:absolute;width:22px;height:22px;border-radius:50%;border:1px solid rgba(225,6,0,.5);animation:ring 2.4s ease-out infinite;}
@keyframes ring{0%{transform:scale(1);opacity:.6;}100%{transform:scale(2.8);opacity:0;}}
.marker-dot{width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid rgba(180,134,11,.7);box-shadow:0 0 8px rgba(225,6,0,.5);transition:all .18s;position:relative;z-index:1;}
.marker-dot.active{background:var(--gold2);border-color:var(--gold2);box-shadow:0 0 14px rgba(180,134,11,.8);transform:scale(1.5);}
#right-panel{position:absolute;right:0;top:0;bottom:0;width:320px;z-index:10;background:#fff;border-left:1px solid var(--border);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.1) transparent;box-shadow:-4px 0 20px rgba(0,0,0,.06);}
#bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 32px rgba(0,0,0,.12);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;}
#bottom-sheet.open{transform:translateY(0);}
.bs-handle{flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:10px 0 6px;}
.bs-handle-bar{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.15);}
.bs-content{flex:1;overflow-y:auto;padding:0 0 20px;}
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:300;height:var(--bottom-nav-h);background:#fff;border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.06);align-items:center;justify-content:space-around;padding:0 8px;padding-bottom:env(safe-area-inset-bottom,0px);}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 16px;border-radius:8px;transition:all .15s;flex:1;}
.bn-item.active{background:rgba(225,6,0,.06);}
.bn-icon{font-size:1.2rem;line-height:1;}
.bn-label{font-family:var(--mono);font-size:.52rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
.bn-item.active .bn-label{color:var(--red);}
.panel-intro{padding:14px 16px 10px;background:linear-gradient(180deg,rgba(225,6,0,.03) 0%,transparent 100%);border-bottom:1px solid var(--border2);}
.panel-intro-title{font-family:var(--head);font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;color:#1a1a1a;margin-bottom:3px;}
.panel-intro-sub{font-family:var(--mono);font-size:.6rem;color:var(--muted);line-height:1.6;}
.panel-intro-sub span{color:var(--red);}
.hub-cta{display:flex;align-items:center;gap:10px;margin:8px 12px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .18s;text-decoration:none;color:inherit;box-shadow:var(--shadow);}
.hub-cta:hover{border-color:rgba(225,6,0,.2);transform:translateY(-1px);}
.hub-cta-icon{font-size:1.1rem;flex-shrink:0;width:28px;text-align:center;}
.hub-cta-info{flex:1;}
.hub-cta-title{font-family:var(--head);font-weight:700;font-size:.88rem;text-transform:uppercase;letter-spacing:.06em;color:#1a1a1a;}
.hub-cta-sub{font-family:var(--mono);font-size:.58rem;color:var(--muted);}
.hub-cta-arr{color:var(--red);font-size:.8rem;}
.section-hd{font-family:var(--head);font-weight:700;font-size:.65rem;text-transform:uppercase;letter-spacing:.18em;color:var(--red);padding:12px 16px 6px;border-bottom:1px solid var(--border2);}
.rank-row{display:flex;align-items:center;gap:8px;padding:7px 16px;border-bottom:1px solid var(--border2);}
.rank-num{font-family:var(--mono);font-size:.65rem;color:var(--muted);width:18px;text-align:right;}
.rank-name{font-family:var(--body);font-weight:600;font-size:.88rem;color:#1a1a1a;flex:1;}
.rank-wins{font-family:var(--mono);font-size:.68rem;color:var(--red);margin-left:auto;}
.rank-1 .rank-name{color:var(--red);}
.rank-2 .rank-name{color:#333;}
.rank-3 .rank-name{color:var(--gold);}
.circ-header{padding:18px 16px 14px;background:linear-gradient(160deg,rgba(225,6,0,.05) 0%,rgba(180,134,11,.03) 100%);border-bottom:1px solid var(--border2);position:relative;}
.circ-round{font-family:var(--mono);font-size:.58rem;color:var(--red);letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px;}
.circ-gp{font-family:var(--head);font-weight:900;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;line-height:1;color:#1a1a1a;margin-bottom:2px;}
.circ-name{font-family:var(--body);font-weight:600;font-size:.8rem;color:var(--gold);}
.circ-date{position:absolute;top:16px;right:14px;font-family:var(--mono);font-size:.6rem;color:var(--muted);text-align:right;line-height:1.8;}
.circ-close{position:absolute;bottom:10px;right:12px;font-family:var(--mono);font-size:.58rem;color:var(--muted);cursor:pointer;padding:3px 8px;border:1px solid var(--border);border-radius:2px;}
.circ-close:hover{color:var(--red);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border2);border-bottom:1px solid var(--border2);}
.stat-cell{background:#fafafa;padding:12px 14px;}
.stat-cell.full{grid-column:1/-1;}
.stat-l{font-family:var(--mono);font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:3px;}
.stat-v{font-family:var(--head);font-weight:800;font-size:1rem;color:#1a1a1a;line-height:1.1;}
.stat-v.red{color:var(--red);}
.stat-v.gold{color:var(--gold);}
.stat-s{font-family:var(--mono);font-size:.56rem;color:var(--muted);margin-top:2px;}
.win-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border2);}
.win-year{font-family:var(--mono);font-size:.65rem;color:var(--muted);width:36px;}
.win-name{font-family:var(--body);font-weight:600;font-size:.86rem;color:#1a1a1a;flex:1;}
.win-badge{font-family:var(--mono);font-size:.55rem;color:var(--red);background:rgba(225,6,0,.06);padding:2px 6px;border-radius:2px;}
.hub-topbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);}
.hub-title{font-family:var(--head);font-weight:900;font-size:1.5rem;text-transform:uppercase;letter-spacing:.06em;color:#1a1a1a;}
.hub-title em{color:var(--red);font-style:normal;}
.hub-back-btn{font-family:var(--mono);font-size:.65rem;color:var(--muted);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:3px;transition:all .15s;flex-shrink:0;}
.hub-back-btn:hover{color:var(--red);}
.hub-count{margin-left:auto;font-family:var(--mono);font-size:.6rem;color:var(--muted);}
.hub-controls{flex-shrink:0;padding:10px 16px 8px;background:var(--bg);border-bottom:1px solid var(--border2);}
.search-bar{width:100%;padding:8px 12px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);color:#1a1a1a;font-family:var(--mono);font-size:.75rem;outline:none;transition:all .2s;margin-bottom:8px;}
.search-bar:focus{border-color:rgba(225,6,0,.3);box-shadow:0 0 0 3px rgba(225,6,0,.06);}
.search-bar::placeholder{color:#bbb;}
.era-row{display:flex;flex-wrap:wrap;gap:5px;}
.era-btn{font-family:var(--mono);font-size:.58rem;padding:4px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:#fff;transition:all .15s;white-space:nowrap;}
.era-btn.active{color:var(--red);border-color:rgba(225,6,0,.25);background:rgba(225,6,0,.04);}
.hub-scroll{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.1) transparent;}
.con-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.con-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .18s;box-shadow:var(--shadow);}
.con-card:hover{border-color:rgba(225,6,0,.2);transform:translateY(-2px);}
.cc-name{font-family:var(--head);font-weight:800;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;color:#1a1a1a;margin-bottom:3px;}
.cc-nat{font-family:var(--mono);font-size:.58rem;color:var(--muted);}
.cc-wins{font-family:var(--mono);font-size:.6rem;color:var(--red);margin-top:4px;}
.cc-yr{font-family:var(--mono);font-size:.56rem;color:var(--muted);margin-top:2px;}
/* ── ERA DRIVER GRID ─────────────────────────────────────── */
.era-block{margin-bottom:20px;}
.era-hd{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.era-yr{font-family:var(--head);font-weight:900;font-size:30px;color:var(--red);line-height:1;flex-shrink:0;}
.era-sublabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex-shrink:0;}
.era-rule{flex:1;height:0.5px;background:rgba(0,0,0,.12);}
.era-meta{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0;}
.tier-hero{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.card-hero{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px 12px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s;box-shadow:var(--shadow);}
.card-hero:hover{border-color:rgba(225,6,0,.35);}
.card-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);}
.ch-code{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--red);margin-bottom:3px;}
.ch-name{font-family:var(--head);font-weight:900;font-size:17px;text-transform:uppercase;color:var(--text);line-height:1;margin-bottom:2px;}
.ch-nat{font-size:11px;color:var(--muted);margin-bottom:8px;}
.ch-bar-wrap{height:3px;background:#f0f0f2;border-radius:2px;margin-bottom:2px;overflow:hidden;}
.ch-bar-wins{height:100%;border-radius:2px;background:var(--red);}
.ch-bar-wr{height:100%;border-radius:2px;background:var(--gold);}
.ch-bar-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--muted);margin-bottom:5px;}
.ch-bottom{display:flex;align-items:flex-end;justify-content:space-between;margin-top:4px;}
.ch-yrs{font-family:var(--mono);font-size:9px;color:var(--muted);}
.ch-titles{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;}
.title-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
.ch-wins-badge{text-align:right;flex-shrink:0;}
.ch-w{font-family:var(--head);font-weight:900;font-size:24px;color:var(--red);line-height:1;}
.ch-wl{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.1em;}
.tier-mid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:7px;}
.card-mid{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .15s;box-shadow:var(--shadow);}
.card-mid:hover{border-color:rgba(225,6,0,.3);}
.cm-code{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--red);margin-bottom:2px;}
.cm-name{font-family:var(--head);font-weight:700;font-size:13px;text-transform:uppercase;color:var(--text);line-height:1.1;margin-bottom:2px;}
.cm-nat{font-size:10px;color:var(--muted);margin-bottom:6px;}
.cm-bar-wrap{height:2px;background:#f0f0f2;border-radius:2px;margin-bottom:1px;overflow:hidden;}
.cm-bar{height:100%;border-radius:2px;}
.cm-bar-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--muted);margin-bottom:4px;}
.tier-sm{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.card-sm-d{background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px 9px;cursor:pointer;transition:border-color .15s;}
.card-sm-d:hover{border-color:rgba(225,6,0,.25);}
.cs-code{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:#aaa;margin-bottom:1px;}
.cs-name{font-family:var(--head);font-weight:700;font-size:11px;text-transform:uppercase;color:var(--text);line-height:1.1;margin-bottom:3px;}
.cs-bar-wrap{height:2px;background:#f0f0f2;border-radius:2px;margin-bottom:2px;overflow:hidden;}
.cs-bar-d{height:100%;border-radius:2px;background:var(--red);}
.cs-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--muted);}
/* ── MODAL ───────────────────────────────────────────────── */
.pi-modal-overlay{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;}
.pi-modal{background:#fff;border-radius:12px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;overflow-x:hidden;box-shadow:0 8px 48px rgba(0,0,0,.18);font-family:var(--body);scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.1) transparent;}
.pi-modal::-webkit-scrollbar{width:3px}
.pi-modal::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:2px}
.pm-hero{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.pm-hero-main{flex:1;}
.pm-code{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--red);text-transform:uppercase;margin-bottom:4px;}
.pm-name{font-family:var(--head);font-weight:900;font-size:26px;text-transform:uppercase;color:#1a1a1a;line-height:1;margin-bottom:4px;}
.pm-sub{font-family:var(--mono);font-size:10px;color:#888;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.pm-dot{color:#ccc;}
.pm-hero-badge{flex-shrink:0;text-align:right;}
.pm-badge-label{font-family:var(--mono);font-size:9px;color:#888;letter-spacing:.12em;text-transform:uppercase;}
.pm-badge-val{font-family:var(--head);font-weight:800;font-size:20px;color:var(--gold);}
.pm-stats{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--border);}
.pm-stat{padding:10px 8px;border-right:1px solid rgba(0,0,0,.05);text-align:center;}
.pm-stat:last-child{border-right:none;}
.pm-stat-l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#999;text-transform:uppercase;margin-bottom:2px;}
.pm-stat-v{font-family:var(--head);font-weight:800;font-size:20px;color:var(--red);line-height:1;}
.pm-stat-s{font-family:var(--mono);font-size:9px;color:#aaa;margin-top:1px;}
.pm-body{display:grid;grid-template-columns:160px 1fr;}
.pm-donut-col{padding:14px 12px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
.pm-right-col{padding:14px 16px;display:flex;flex-direction:column;gap:14px;}
.pm-section-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;margin-bottom:6px;}
.pm-donut-legend{display:flex;flex-direction:column;gap:4px;}
.pm-leg{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:#888;}
.pm-leg-sq{width:7px;height:7px;border-radius:1px;flex-shrink:0;}
.pm-team-row{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.04);}
.pm-team-row:last-child{border-bottom:none;}
.pm-team-name{font-size:11px;color:#1a1a1a;font-weight:600;min-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pm-team-bar-wrap{flex:1;height:4px;background:#f0f0f2;border-radius:2px;overflow:hidden;}
.pm-team-bar{height:100%;border-radius:2px;}
.pm-team-meta{font-family:var(--mono);font-size:9px;color:#aaa;white-space:nowrap;}
.pm-spark-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.pm-spark-yr{font-family:var(--mono);font-size:9px;color:#888;min-width:28px;}
.pm-spark-wrap{flex:1;height:28px;}
.pm-spark-pts{font-family:var(--mono);font-size:9px;color:var(--gold);min-width:38px;text-align:right;}
.pm-wdc-pills{display:flex;flex-wrap:wrap;gap:3px;}
.pm-wdc-pill{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:8px;background:rgba(225,6,0,.06);color:var(--red);border:1px solid rgba(225,6,0,.15);}
.pm-seasons-row{border-top:1px solid var(--border);padding:10px 16px;}
.pm-seasons-wrap{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px;}
.pm-szn{font-family:var(--mono);font-size:9px;padding:2px 4px;border-radius:2px;background:#f5f5f7;color:#888;border:1px solid var(--border);}
.pm-szn.champ{background:rgba(225,6,0,.06);color:var(--red);border-color:rgba(225,6,0,.18);}
.pm-footer{padding:8px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pm-score-label{font-family:var(--mono);font-size:9px;color:#aaa;}
.pm-close{font-family:var(--mono);font-size:9px;color:#888;border:1px solid rgba(0,0,0,.12);border-radius:3px;padding:3px 10px;cursor:pointer;background:none;}
.pm-close:hover{color:var(--red);border-color:rgba(225,6,0,.3);}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:2px;}
@media(max-width:767px){
  .tb-hamburger{display:flex;}.tb-nav{display:none;}.lang-toggle{display:none;}
  #app{padding-bottom:var(--bottom-nav-h);}
  #right-panel{display:none;}
  #bottom-nav{display:flex;}
  .tier-hero{grid-template-columns:1fr;}
  .tier-mid{grid-template-columns:1fr 1fr;}
  .tier-sm{grid-template-columns:repeat(3,1fr);}
  .era-yr{font-size:22px;}
  .pm-stats{grid-template-columns:repeat(3,1fr);}
  .pm-body{grid-template-columns:1fr;}
  .pm-donut-col{border-right:none;border-bottom:1px solid var(--border);}
  .hub-title{font-size:1.2rem;}
  .con-grid{grid-template-columns:repeat(2,1fr);}
}
@media(min-width:768px) and (max-width:1023px){
  .tb-hamburger{display:none;}.tb-nav{display:flex;}
  #bottom-nav{display:none;}#right-panel{width:280px;}
}
@media(min-width:1024px){
  .tb-hamburger{display:none;}.tb-nav{display:flex;}
  #bottom-nav{display:none;}#right-panel{width:320px;}
}
</style>

  {min:2020,max:2026,yr:'2020+',sub:'Hybrid · Ground Effect'},
  {min:2010,max:2019,yr:'2010s',sub:'Turbo Hybrid'},
  {min:2000,max:2009,yr:'2000s',sub:'V10 / V8'},

function initDriverHub(){

function filterDrivers(){dSearch=document.getElementById('driver-search').value.toLowerCase();renderDrivers();}

function renderDrivers(){
  const era=ERAS[activeEra];
  const getS=id=>dsd[id]||dsd[String(id)];
  const getW=id=>{const s=getS(id);return s?s[0]:0;};
  const getWR=id=>{const s=getS(id);return(s&&s[1])?((s[0]/s[1])*100):0;};
  const getC=id=>D.driverCareer[id]||D.driverCareer[String(id)]||{};
  const matchSearch=d=>!dSearch||d.name.toLowerCase().includes(dSearch)||(d.code&&d.code!=='\\N'&&d.code.toLowerCase().includes(dSearch));
  const inEra=(c,eb)=>c.firstYear<=eb.max&&c.lastYear>=eb.min;

  const erasToShow=ERA_DEFS.filter(eb=>eb.min<=era.max&&eb.max>=era.min);
  let totalShown=0,html='';

  erasToShow.forEach(eb=>{
    const drivers=D.allDrivers.filter(d=>{
      const c=getC(d.id);
      return c.firstYear&&inEra(c,eb)&&matchSearch(d);
    }).sort((a,b)=>getW(b.id)-getW(a.id));
    if(!drivers.length)return;
    totalShown+=drivers.length;

    const maxW=Math.max(getW(drivers[0]?.id),1);
    const maxWR=Math.max(...drivers.map(d=>getWR(d.id)),0.1);

    /* tier thresholds */
    const heroes=drivers.filter(d=>{const s=getS(d.id);return s&&s[6]&&s[6].length>0;}).slice(0,2);
    const heroSet=new Set(heroes.map(d=>d.id));
    const mids=drivers.filter(d=>!heroSet.has(d.id)&&getW(d.id)>=3).slice(0,3);
    const midSet=new Set(mids.map(d=>d.id));
    const smalls=drivers.filter(d=>!heroSet.has(d.id)&&!midSet.has(d.id)).slice(0,10);

    const code=d=>d.code&&d.code!=='\\N'?d.code:'—';

    const cardHero=d=>{
      const s=getS(d.id)||[];
      const[w=0,r=0,po=0,pl=0,fl=0,dn=0,titles=[],teams=[],pts={}]=s;
      const c=getC(d.id);
      const wr=r>0?((w/r)*100).toFixed(1):0;
      const wPct=Math.round((w/maxW)*100);
      const wrPct=Math.round((parseFloat(wr)/maxWR)*100);
      const dots=titles.slice(0,8).map(()=>'<div class="title-dot"></div>').join('');
      return `<div class="card-hero" onclick="showDriver(${d.id})">
        <div class="ch-code">${code(d)}</div>
        <div class="ch-name">${d.name}</div>
        <div class="ch-nat">${nf(d.nat)} ${d.nat}</div>
        <div class="ch-bar-wrap"><div class="ch-bar-wins" style="width:${wPct}%"></div></div>
        <div class="ch-bar-label"><span>wins</span><span>${w}</span></div>
        <div class="ch-bar-wrap"><div class="ch-bar-wr" style="width:${Math.max(wrPct,2)}%"></div></div>
        <div class="ch-bar-label"><span>win rate</span><span>${wr}%</span></div>
        <div class="ch-bottom">
          <div><div class="ch-yrs">${c.firstYear||''}–${c.lastYear||''} · ${r} GPs</div><div class="ch-titles">${dots}</div></div>
          <div class="ch-wins-badge"><div class="ch-w">${w}</div><div class="ch-wl">WINS</div></div>
        </div>
      </div>`;
    };

    const cardMid=d=>{
      const s=getS(d.id)||[];
      const w=s[0]||0,r=s[1]||0;
      const c=getC(d.id);
      const wr=r>0?((w/r)*100).toFixed(1):0;
      const wPct=Math.round((w/maxW)*100);
      const wrPct=Math.round((parseFloat(wr)/maxWR)*100);
      return `<div class="card-mid" onclick="showDriver(${d.id})">
        <div class="cm-code">${code(d)}</div>
        <div class="cm-name">${d.name}</div>
        <div class="cm-nat">${nf(d.nat)} ${d.nat} · ${c.firstYear||''}–${c.lastYear||''}</div>
        <div class="cm-bar-wrap"><div class="cm-bar" style="width:${Math.max(wPct,2)}%;background:var(--red)"></div></div>
        <div class="cm-bar-row"><span>wins</span><span>${w}</span></div>
        <div class="cm-bar-wrap"><div class="cm-bar" style="width:${Math.max(wrPct,2)}%;background:var(--gold)"></div></div>
        <div class="cm-bar-row"><span>win rate</span><span>${wr}%</span></div>
      </div>`;
    };

    const cardSm=d=>{
      const s=getS(d.id)||[];
      const w=s[0]||0,r=s[1]||0;
      const c=getC(d.id);
      const wPct=Math.max(Math.round((w/maxW)*100),1);
      return `<div class="card-sm-d" onclick="showDriver(${d.id})">
        <div class="cs-code">${code(d)}</div>
        <div class="cs-name">${d.name}</div>
        <div class="cs-bar-wrap"><div class="cs-bar-d" style="width:${wPct}%"></div></div>
        <div class="cs-row"><span>${nf(d.nat)}</span><span>${c.firstYear||''}–${c.lastYear||''}${w?' · '+w+'W':''}</span></div>
      </div>`;
    };

    html+=`<div class="era-block">
      <div class="era-hd">
        <div class="era-yr">${eb.yr}</div>
        <div class="era-sublabel">${eb.sub}</div>
        <div class="era-rule"></div>
        <div class="era-meta">${drivers.length} drivers</div>
      </div>
      ${heroes.length?`<div class="tier-hero">${heroes.map(cardHero).join('')}</div>`:''}
      ${mids.length?`<div class="tier-mid">${mids.map(cardMid).join('')}</div>`:''}
      ${smalls.length?`<div class="tier-sm">${smalls.map(cardSm).join('')}</div>`:''}
    </div>`;
  });

  document.getElementById('driver-count').textContent=totalShown+' drivers';
  document.getElementById('driver-grid').innerHTML=html;
  document.getElementById('driver-detail-box').innerHTML='';
}

/* ── CANVAS HELPERS ──────────────────────────────────────────── */
function drawDonut(canvas,w,po,r){
  const ctx=canvas.getContext('2d'),CX=60,CY=60,R=48,thick=14;
  canvas.width=120;canvas.height=120;
  const slices=[{v:r>0?w/r:0,c:'#e10600'},{v:r>0?(po-w)/r:0,c:'#b8860b'},{v:r>0?(r-po)/r:0,c:'#e8e8ea'}];
  let a=-Math.PI/2;
  slices.forEach(sl=>{if(sl.v<=0)return;const sw=sl.v*2*Math.PI;ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,R,a,a+sw);ctx.closePath();ctx.fillStyle=sl.c;ctx.fill();a+=sw;});
  ctx.beginPath();ctx.arc(CX,CY,R-thick,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 14px Barlow Condensed,sans-serif';ctx.fillStyle='#e10600';ctx.fillText(w+'W',CX,CY-6);
  ctx.font='400 9px Share Tech Mono,monospace';ctx.fillStyle='#999';ctx.fillText(r+' GPs',CX,CY+7);
}
function drawSpark(canvas,ptsObj){
  const years=Object.keys(ptsObj).map(Number).sort((a,b)=>a-b);if(!years.length)return;
  const vals=years.map(y=>ptsObj[y]);const maxV=Math.max(...vals,1);
  const W=canvas.offsetWidth||160,H=28;canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');const pad=2,bw=Math.max(2,Math.floor((W-pad*2)/vals.length)-1);
  vals.forEach((v,i)=>{const bh=Math.max(2,Math.round((v/maxV)*(H-pad*2)));const x=pad+i*(bw+1),y=H-pad-bh;ctx.fillStyle='#e10600';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,bw,bh,1);else ctx.rect(x,y,bw,bh);ctx.fill();});
}
function greatestScore(w,r,titles,firstYear,lastYear){
  if(!r)return 0;
  const era=lastYear<=1966?1.35:lastYear<=1982?1.15:lastYear<=2000?1.05:1.0;
  return Math.min(99.9,((w/r)*100*era*(1+titles.length*0.25)*(Math.log10(r+1)/1.5))).toFixed(1);
}

<div class="pm-stat"><div class="pm-stat-l">Poles</div><div class="pm-stat-v">${pl}</div><div class="pm-stat-s">${r>0?((pl/r)*100).toFixed(1):0}%</div></div>
<div class="pm-stat"><div class="pm-stat-l">Fast Laps</div><div class="pm-stat-v">${fl}</div><div class="pm-stat-s">${r>0?((fl/r)*100).toFixed(1):0}%</div></div>
<div class="pm-stat"><div class="pm-stat-l">DNFs</div><div class="pm-stat-v" style="color:#888">${dn}</div><div class="pm-stat-s">${dr}%</div></div>
<div class="pm-stat"><div class="pm-stat-l">Titles</div><div class="pm-stat-v" style="color:${titles.length?'#b8860b':'#ccc'}">${titles.length}</div><div class="pm-stat-s">${titles.length?'WDC':'—'}</div></div>
</div>
<div class="pm-body">
<div class="pm-donut-col">
<div class="pm-section-label">Career breakdown</div>
<canvas id="pm-donut-${id}"></canvas>
<div class="pm-donut-legend">
<div class="pm-leg"><div class="pm-leg-sq" style="background:#e10600"></div>Wins (${wr}%)</div>
<div class="pm-leg"><div class="pm-leg-sq" style="background:#b8860b"></div>Podiums (${r>0?(((po-w)/r)*100).toFixed(1):0}%)</div>
<div class="pm-leg"><div class="pm-leg-sq" style="background:#e8e8ea"></div>Other (${r>0?(((r-po)/r)*100).toFixed(1):0}%)</div>
</div>
${titles.length?'<div><div class="pm-section-label" style="margin-bottom:4px">WDC titles</div><div class="pm-wdc-pills">'+titles.map(y=>'<span class="pm-wdc-pill">'+y+'</span>').join('')+'</div></div>':''}
</div>
<div class="pm-right-col">
<div><div class="pm-section-label">Teams</div>${teams.slice(0,8).map(([tn,ty,tw])=>{const bp=Math.min(100,Math.round((ty.length/maxTY)*100));const yl=ty[0]===ty[ty.length-1]?ty[0]:ty[0]+'–'+ty[ty.length-1];return '<div class="pm-team-row"><div class="pm-team-name" title="'+tn+'">'+tn+'</div><div class="pm-team-bar-wrap"><div class="pm-team-bar" style="width:'+bp+'%;background:'+teamColor(tn)+'"></div></div><div class="pm-team-meta">'+yl+(tw?' · '+tw+'W':'')+'</div></div>';}).join('')}</div>
${sparkYears.length?'<div><div class="pm-section-label">Points by season</div>'+sparkYears.map(yr=>'<div class="pm-spark-row"><div class="pm-spark-yr">'+yr+'</div><div class="pm-spark-wrap"><canvas id="pm-sp-'+id+'-'+yr+'"></canvas></div><div class="pm-spark-pts">'+(pts_by_season[yr]||pts_by_season[String(yr)]||0)+'pts</div></div>').join('')+'</div>':''}
</div></div>
${seasonYears.length?'<div class="pm-seasons-row"><div class="pm-section-label">Seasons competed ('+seasonYears.length+')</div><div class="pm-seasons-wrap">'+seasonYears.map(y=>'<div class="pm-szn'+(champSet.has(y)?' champ':'')+'">'+y+'</div>').join('')+'</div></div>':''}
<div class="pm-footer"><div class="pm-score-label">Score: winRate × era × title_bonus · <strong style="color:#b8860b">${score}</strong></div><button class="pm-close" onclick="this.closest('.pi-modal-overlay').remove()">✕ close</button></div>
</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  requestAnimationFrame(()=>{
    const dc=document.getElementById('pm-donut-'+id);
    if(dc)drawDonut(dc,w,po,r);
    const allPts=Object.fromEntries(Object.entries(pts_by_season).map(([y,p])=>[y,p]));
    sparkYears.forEach(yr=>{const sc=document.getElementById('pm-sp-'+id+'-'+yr);if(sc)drawSpark(sc,allPts);});
  });
  document.getElementById('driver-detail-box').innerHTML='';
}

/* ── SHOW CONSTRUCTOR MODAL ──────────────────────────────────── */
function showCon(id){
  document.querySelectorAll('.pi-modal-overlay').forEach(el=>el.remove());
  const con=D.allConstructors.find(x=>x.id===id);if(!con)return;
  const s=csd[id]||csd[String(id)];if(!s)return;
  const[w,r,titles,firstYear,lastYear]=s;
  const wr=r>0?((w/r)*100).toFixed(1):0;
  const topDrivers=D.topDrivers.filter(d=>{const tm=(dsd[d.driverId]||dsd[String(d.driverId)]||[])[7]||[];return tm.some(t=>{const cn=con.name.replace(/\s*(F1 Team|Racing)/i,'').trim();return t[0].includes(cn.split(' ')[0])||cn.includes(t[0].split(' ')[0]);});}).slice(0,8);
  const overlay=document.createElement('div');
  overlay.className='pi-modal-overlay';
  overlay.innerHTML=`<div class="pi-modal" role="dialog" aria-modal="true">
<div class="pm-hero"><div class="pm-hero-main">
<div class="pm-code">${nf(con.nat)} ${con.nat}</div>
<div class="pm-name">${con.name}</div>
<div class="pm-sub"><span>${firstYear}–${lastYear}</span><span class="pm-dot">·</span><span>${r} entries</span>${titles.length?'<span class="pm-dot">·</span><span>'+titles.length+'× WCC</span>':''}</div>
</div><div class="pm-hero-badge"><div class="pm-badge-label">Total wins</div><div class="pm-badge-val" style="color:#e10600">${w}</div></div></div>
<div class="pm-stats" style="grid-template-columns:repeat(4,1fr)">
<div class="pm-stat"><div class="pm-stat-l">Wins</div><div class="pm-stat-v">${w}</div><div class="pm-stat-s">${wr}%</div></div>
<div class="pm-stat"><div class="pm-stat-l">Entries</div><div class="pm-stat-v" style="color:#888">${r}</div><div class="pm-stat-s">${firstYear}–${lastYear}</div></div>
<div class="pm-stat"><div class="pm-stat-l">WCC Titles</div><div class="pm-stat-v" style="color:${titles.length?'#b8860b':'#ccc'}">${titles.length}</div><div class="pm-stat-s">${titles.length?'champion':'—'}</div></div>
<div class="pm-stat"><div class="pm-stat-l">Active</div><div class="pm-stat-v" style="color:#888;font-size:14px">${lastYear-firstYear+1}</div><div class="pm-stat-s">seasons</div></div>
</div>
${titles.length?'<div style="padding:10px 16px;border-bottom:1px solid rgba(0,0,0,.07)"><div class="pm-section-label" style="margin-bottom:4px">WCC Championships</div><div class="pm-wdc-pills">'+titles.map(y=>'<span class="pm-wdc-pill">'+y+'</span>').join('')+'</div></div>':''}
${topDrivers.length?'<div style="padding:10px 16px;border-bottom:1px solid rgba(0,0,0,.07)"><div class="pm-section-label" style="margin-bottom:6px">Notable drivers</div><div style="display:flex;flex-wrap:wrap;gap:4px">'+topDrivers.map(d=>'<span class="pm-wdc-pill" style="background:rgba(184,134,11,.06);color:#b8860b;border-color:rgba(184,134,11,.2)">'+d.forename+' '+d.surname+'</span>').join('')+'</div></div>':''}
<div class="pm-footer"><div class="pm-score-label">${con.name} · ${con.nat} · ${firstYear}–${lastYear}</div><button class="pm-close" onclick="this.closest('.pi-modal-overlay').remove()">✕ close</button></div>
</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.getElementById('con-detail-box').innerHTML='';
}

/* ── INIT ────────────────────────────────────────────────────── */

// ── INIT ─────────────────────────────────────────────────────
renderDefault();
requestAnimationFrame(()=>setTimeout(initMap,80));
try{const saved=localStorage.getItem('pi_lang');if(saved&&LANGS[saved])setTimeout(()=>setLang(saved),100);}catch(e){}

</script>
</body>
</html>
