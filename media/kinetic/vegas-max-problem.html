function ring(bx,by,age,col=GOLD){
  if(age<0||age>0.55)return;

function txt(str,x,y,size,col,t0,t,w=900,align='center',pop=0){

  X.save();X.globalAlpha=u;X.textAlign=align;X.fillStyle=col;
  let f=size;X.font=`${w} ${f}px G`;
  const tw=X.measureText(str).width;

function pulse(t){return Math.exp(-3.2*((t/BEAT)%1));}

// barra/columna con glow rosa
function column(cx,top,w,h,t,k){

}

// salto parametrizado: clip comprimido a dur d, de (x0,y0) a (x1,y1)
// despegue 0.5/2·d, toque 1.542/2·d dentro del tramo
function hop(ct,d,x0,y0,x1,y1){
  const u=ct/d, cu=u*2;           // tiempo de clip equivalente (0..2)
  const air0=0.54, air1=1.542;
  const p=ss((cu-air0)/(air1-air0));
  return {idx:Math.floor(cu*24), x:lerp(x0,x1,p), base:lerp(y0,y1,p)};
}

    if(tw>700){f=f*700/tw;X.font=`900 ${f}px G`;}
    X.translate(540,930);X.scale(sc,sc);
    X.fillStyle=PINK;X.shadowColor=PINK;X.shadowBlur=40*a;
    X.fillText("WHAT'S AT STAKE?",0,0);X.restore();}}
  txt('SECOND IN THE',540,340,86,PAPER,1.8,t);
  txt('CHAMPIONSHIP',540,450,96,GOLD,1.9,t);
  for(const b of B5){
    const u=ss((t-RISE5)/0.5);if(u<=0)continue;
    const h=b.p*PT5*u, top=GND5-h;
    column(b.cx,top,BW5,h,t,0.15+0.25*pulse(t));
    X.textAlign='center';
    if(u>0.95){
      X.fillStyle=WHITE;X.font='900 64px G';X.fillText(b.code,b.cx,top+84);
      const pu=ss((t-b.say)/0.25);
      if(pu>0){const sc=1+0.18*Math.sin(Math.PI*cl((t-b.say)/0.35));
        X.save();X.globalAlpha=pu;X.translate(b.cx,top+190);X.scale(sc,sc);
        X.fillStyle=GOLD;X.font='900 88px G';X.fillText(String(b.p),0,0);X.restore();}
    }
    if(b.code==='MAX'){pose('C',b.cx,top);}
  }
  X.fillStyle='rgba(90,77,99,0.4)';X.fillRect(60,GND5,960,3);
  X.restore();
}

// ============ ESCENA 6 · candado ============
function s6(t){
  const cx=560,cy=1060;
  txt("EVEN A WIN CAN'T LOCK IT",540,560,64,PAPER,0.12,t);
  // intenta cerrar dos veces y rebota ("lock" se dice en 36.76)
  let lift=90;
  const try1=0.5,try2=36.76-S[5];
  function att(t0){const a=t-t0;
    if(a<0)return null;
    if(a<0.3)return lerp(90,8,ss(a/0.3));          // baja
    if(a<0.75)return lerp(8,74,ss((a-0.3)/0.45));  // rebota
    return 74;}
  const l1=att(try1),l2=att(try2);
  if(l2!==null)lift=l2; else if(l1!==null)lift=l1;
  // tubeMax (pose B) empuja el arco y este rebota abierto
  function lunge(t0){const a=t-t0;if(a<0||a>0.75)return 0;
    return a<0.3?ss(a/0.3):1-ss((a-0.3)/0.45);}
  const lg=Math.max(lunge(try1-0.15),lunge(try2-0.15));
  X.save();X.translate(225+lg*30,1280);X.rotate(0.05+lg*0.13);
  X.translate(-225,-1280);pose('B',225,1280);X.restore();
  const wob=(t>try1+0.28&&t<try1+0.6)||(t>try2+0.28&&t<try2+0.6)?Math.sin(t*50)*5:0;
  X.save();X.translate(cx+wob,0);
  // arco
  X.strokeStyle=GOLD;X.lineWidth=34;X.lineCap='round';
  X.beginPath();X.arc(0,cy-110-lift,120,Math.PI,0,false);
  X.moveTo(-120,cy-110-lift);X.lineTo(-120,cy-40-lift);
  X.moveTo(120,cy-110-lift);X.lineTo(120,cy-70);
  X.stroke();
  // cuerpo
  X.fillStyle=GOLD;
  X.beginPath();X.roundRect(-190,cy-80,380,300,22);X.fill();
  X.fillStyle=PANEL;X.font='900 120px G';X.textAlign='center';
  X.fillText('P2',0,cy+120);
  X.restore();
  // flash rosa en cada rebote
  for(const t0 of [try1,try2]){const a=t-(t0+0.3);
    if(a>0&&a<0.3){X.fillStyle=`rgba(255,63,174,${0.25*(1-a/0.3)})`;X.fillRect(0,0,1080,1920);}}
}

// ============ ESCENA 7 · cierre ============
function s7(t){
  txt('CAN THE VEGAS KING',540,360,88,PAPER,0.35,t);
  txt('BEAT THE COLD?',540,480,96,PINK,0.5,t);
  // sello fecha
  const u=ss((t-(40.0-S[6]))/0.3);
  if(u>0){
    X.save();X.globalAlpha=u;X.translate(540,660);X.rotate(-0.045);
    const sc=1+0.3*(1-u);X.scale(sc,sc);
    X.strokeStyle=GOLD;X.lineWidth=6;X.strokeRect(-330,-86,660,128);
    X.fillStyle=GOLD;X.font='900 108px G';X.textAlign='center';
    X.fillText('SAT NOV 21',0,16);X.restore();
  }
  pose('D',540,1500);
}

// ============ master ============
window.draw=function(t){
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;
  X.fillStyle=BG;X.fillRect(0,0,1080,1920);
  const fns=[s1,s2,s3,s4,s5,s6,s7];
  let i=fns.length-1;while(i>0&&t<S[i])i--;
  fns[i](t-S[i]);   // cortes duros entre escenas, sin fundido
  // grano + viñeta en todo
  X.globalAlpha=0.5;X.drawImage(GR,0,0,1080,1920);X.globalAlpha=1;
  const g=X.createRadialGradient(540,960,520,540,960,1250);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.4)');
  X.fillStyle=g;X.fillRect(0,0,1080,1920);
};
