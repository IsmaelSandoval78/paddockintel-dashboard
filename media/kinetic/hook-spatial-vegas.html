<canvas id="c" width="1080" height="1920"></canvas>
<script src="file:///private/tmp/claude-501/-Users-ismaelsandoval-Documents-GitHub-paddockintel-dashboard/12d5a36f-4a15-4cfa-a0cd-431001d9497b/scratchpad/vegas-landing.data.js"></script>
<script src="lib/vegas-kinetic.js"></script>
<script>
// ─── Teaser espacial Las Vegas (9:16, 6s) — ref spatial.mov ───
// Vuelo por frases-plano con datos verificados (41 años 1982→2023; 4 ganadores en
// 5 carreras: Jones, Alboreto, Verstappen, Russell) y aterrizaje exacto en el
// fotograma 0 del preview mural, para empalmar con él. Paleta las-vegas.
const c=document.getElementById('c'),X=c.getContext('2d');
const W=1080,H=1920;
const BG='#0C0A12',INK='#FF2D87',GOLD='#D4AF37',PAPER='#F2EDE4',DIM='#5A4D63';
const FOC=1150;

const cl=(v,a,b)=>Math.min(b,Math.max(a,v)), lp=(a,b,k)=>a+(b-a)*k;
const ss=k=>{k=cl(k,0,1);return k*k*k*(k*(k*6-15)+10);};
const hash=i=>{let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function kf(t,pts){for(let i=0;i<pts.length-1;i++){const[a,va]=pts[i],[b,vb]=pts[i+1];
  if(t<=b)return lp(va,vb,ss((t-a)/(b-a||1)));}return pts[pts.length-1][1];}
function F(w,px){return `${w} ${px}px G`;}

function mk(w,h,fn){const q=document.createElement('canvas');q.width=w;q.height=h;
  const g=q.getContext('2d');g.textBaseline='alphabetic';fn(g);return q;}

let PLANES=[];
// slotreel «41» (vegas-kinetic): spin alargado para que gire durante el vuelo y
// se asiente justo al abrir la pausa de lectura (t≈2.05); el jackpot se encadena
// con duration() en el instante exacto en que cae el último rodillo
let P2C=null,SL=null,SET=0;
const SLOT={value:'41',delay:0,spin:1.3};
function paintP2(t){
  const g=P2C.getContext('2d');
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,1100,1300);g.textBaseline='alphabetic';
  const o={x:SL.cx,y:SL.cy,size:SL.size,ink:GOLD,accent:INK,paper:'#16121F',font:'G'};
  VegasKinetic.draw(g,'slotreel',Object.assign({t},SLOT,o));
  VegasKinetic.draw(g,'jackpot',Object.assign({t:t-SET},o));
  g.font='900 290px G';g.fillStyle=PAPER;g.fillText('YEARS.',40,900);
  g.font='500 64px G';g.fillStyle=DIM;g.fillText('1982 → 2023',48,1030);
}
function buildPlanes(img){
  const p1=mk(1100,1300,g=>{
    g.font='500 64px G';g.fillStyle=DIM;g.fillText('FORMULA 1 · 2026',56,120);
    let px=360;g.font=`900 ${px}px G`;
    const w=g.measureText('VEGAS').width;
    if(40+w>1060){px=Math.floor(px*1020/w);g.font=`900 ${px}px G`;}
    g.fillStyle=INK;g.fillText('VEGAS',40,500);
    g.fillStyle=PAPER;g.fillText('WEEK.',40,860);
    g.strokeStyle=DIM;g.setLineDash([10,10]);g.lineWidth=3;
    g.strokeRect(20,30,1060,1080);
  });
  // p2 se repinta cada fotograma (paintP2): el 41 es un slotreel de VegasKinetic
  // que gira durante el vuelo y clava la cifra al llegar la pausa de lectura
  const p2=mk(1100,1300,g=>{});
  P2C=p2;
  const bx=VegasKinetic.box('slotreel',SLOT);
  const size=Math.min(500*220/bx.h,1020*220/bx.w);
  SL={size,cx:40+bx.w*size/440,cy:110+bx.h*size/440};
  SET=VegasKinetic.duration('slotreel',SLOT);
  const p3=mk(1100,1300,g=>{
    g.font='900 620px G';g.fillStyle=INK;g.fillText('4',40,600);
    let px=250;g.font=`900 ${px}px G`;
    const w=g.measureText('WINNERS.').width;
    if(40+w>1060){px=Math.floor(px*1020/w);g.font=`900 ${px}px G`;}
    g.fillStyle=PAPER;g.fillText('WINNERS.',40,880);
    g.font='500 64px G';g.fillStyle=DIM;g.fillText('IN 5 RACES',48,1010);
  });
  const side=(txt,ink)=>mk(900,160,g=>{g.font='500 92px G';g.fillStyle=ink;g.fillText(txt,10,110);});
  // laterales: solo visibles en vuelo (fuera de la ventana de niebla en las pausas)
  PLANES=[
    {z:1300,x:0,   y:0,   yaw:-0.08,w:950,h:1123,img:p1,n:40},
    {z:2700,x:-420,y:-520,yaw: 0.46,w:560,h:100, img:side('CAESARS PALACE',PAPER),n:14},
    {z:3900,x:180, y:-60, yaw:-0.28,w:900,h:1064,img:p2,n:40},
    {z:4700,x:420, y:560, yaw:-0.34,w:560,h:100, img:side('THE STRIP',DIM),n:14},
    {z:5300,x:-430,y:-560,yaw: 0.40,w:620,h:110, img:side('VER · RUS · VER',PAPER),n:14},
    {z:6500,x:-180,y:60,  yaw: 0.24,w:900,h:1064,img:p3,n:40},
    {z:9200,x:0,   y:0,   yaw: 0,   w:1080,h:1920,img,  n:54,landing:true},
  ].sort((a,b)=>b.z-a.z);
}

const CZ=[[0,0],[1.00,0],[2.05,2600],[2.45,2600],[3.45,5200],[3.85,5200],[5.30,8050],[6.0,8050]];
const CX=[[0,0],[1.00,0],[2.05,120],[2.45,120],[3.45,-120],[3.85,-120],[5.30,0],[6.0,0]];
const CY=[[0,0],[2.05,-50],[3.45,55],[5.30,0],[6.0,0]];

function drawPlane(p,cz,cx,cy){
  const d0=p.z-cz-Math.abs(Math.sin(p.yaw))*p.w/2;
  if(d0<42)return;
  const dc=p.z-cz;
  const ghost=p.landing?0:0.14*cl((7000-dc)/2500,0,1);
  const far=Math.max(cl((2600-dc)/600,0,1),ghost);
  const near=p.landing?1:cl((dc-260)/320,0,1);
  const a=far*near;
  if(a<=0.01)return;
  const rx=Math.cos(p.yaw),rz=Math.sin(p.yaw),w2=p.w/2,h2=p.h/2;
  const pt=u=>[p.x+rx*(u*p.w-w2),p.z+rz*(u*p.w-w2)];
  const prj=(x,y,z)=>{const k=FOC/(z-cz);return [540+(x-cx)*k,960+(y-cy)*k];};
  const cw=p.img.width,ch=p.img.height,N=p.n,sw=cw/N;
  X.save();X.globalAlpha=a;
  for(let i=0;i<N;i++){
    const [xa,za]=pt(i/N),[xb,zb]=pt((i+1)/N);
    if(za-cz<42||zb-cz<42)continue;
    const t0=prj(xa,p.y-h2,za),t1=prj(xb,p.y-h2,zb),b0=prj(xa,p.y+h2,za);
    X.setTransform((t1[0]-t0[0])/sw,(t1[1]-t0[1])/sw,(b0[0]-t0[0])/ch,(b0[1]-t0[1])/ch,t0[0],t0[1]);
    X.drawImage(p.img,i*sw,0,sw,ch,0,0,sw+1.2,ch);
  }
  X.setTransform(1,0,0,1,0,0);X.restore();
}

let GRAIN=null;
function makeGrain(){const g=document.createElement('canvas');g.width=g.height=512;
  const gx=g.getContext('2d'),im=gx.createImageData(512,512);
  let sd=1234>>>0;const rnd=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296;};
  for(let i=0;i<im.data.length;i+=4){const lum=rnd()<0.5?0:255;
    im.data[i]=im.data[i+1]=im.data[i+2]=lum;
    im.data[i+3]=rnd()<0.18?Math.floor(10+rnd()*22):0;}
  gx.putImageData(im,0,0);GRAIN=g;}
function grain(){if(!GRAIN)makeGrain();X.save();X.globalAlpha=0.5;
  for(let y=0;y<H;y+=512)for(let x=0;x<W;x+=512)X.drawImage(GRAIN,x,y);X.restore();}

window.draw=function(t){
  const dk=cl((5.2-t)/0.5,0,1);
  const cz=kf(t,CZ),
        cx=kf(t,CX)+dk*(22*Math.sin(t*0.9+1.3)+9*Math.sin(t*1.7+0.5)),
        cy=kf(t,CY)+dk*(26*Math.sin(t*0.7+4.0)+10*Math.sin(t*1.3+2.0));
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;
  X.fillStyle=BG;X.fillRect(0,0,W,H);
  X.fillStyle=DIM;
  for(let i=0;i<70;i++){
    const x=(hash(i)-0.5)*2600,y=(hash(i+99)-0.5)*4400,z=200+hash(i+7)*8600;
    const d=z-cz;if(d<70)continue;const k=FOC/d;
    X.globalAlpha=0.55*cl((d-180)/420,0,1)*cl(1-(d-5200)/3800,0.25,1);
    X.beginPath();X.arc(540+(x-cx)*k,960+(y-cy)*k,cl(2.6*k*3,0.8,5),0,7);X.fill();
  }
  X.globalAlpha=1;
  if(P2C)paintP2(t);
  for(const p of PLANES)drawPlane(p,cz,cx,cy);
  grain();
};

const img=new Image();img.src=window.LANDING;
Promise.all([document.fonts.load(F(900,100)),document.fonts.load(F(500,30)),img.decode()])
 .then(()=>{buildPlanes(img);window.ready=true;draw(0);});
</script></body></html>
