<!doctype html><html><head><meta charset="utf-8"><title>mural episodio</title><style>
@font-face{font-family:G;font-weight:900;src:url(inter-tight-latin-900-normal.woff2)}@font-face{font-family:G;font-weight:500;src:url(inter-tight-latin-500-normal.woff2)}
html,body{margin:0;background:#060607;height:100%;display:grid;place-items:center}
canvas{max-height:100vh;max-width:100vw}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ─── Mural episodio (16:9) — muro 3 filas × 5 celdas (7700×4330), capítulos REGADOS ───
// El guion manda el orden temporal (13 capítulos), pero cada capítulo vive en una celda
// distinta del muro (CELLS): la cámara salta en diagonales, arriba y abajo — nunca en
// simple izquierda→derecha. Cada dato aparece cuando la narración lo dice (cues).
// Reglas de encuadre (v2): bloque protagonista ≥60% ancho o ≥50% alto; cifra ≥280px;
// texto legible ≥44px; sin zonas negras vacías. Recursos de referencia por capítulo.
const c=document.getElementById('c'),X=c.getContext('2d');
let W=1920,H=1080;const PW=7700,PH=4330;
const BG='#0B0B0D',INK='#F7C400',PAPER='#EDEAE2',DIM='#55524A',WALL='#060607';
const MARGIN=60,CAP_TOP=880;                    // CAP_TOP: techo de la banda de subtítulos
let S=null,T=null,E=null,BEAT=0.566,BAR=2.264,LEN=182,MEAS={},LASTCAP=0;

const cl=(v,a,b)=>Math.min(b,Math.max(a,v)), lp=(a,b,k)=>a+(b-a)*k;
const ss=k=>{k=cl(k,0,1);return k*k*k*(k*(k*6-15)+10);};
const outExpo=k=>k>=1?1:1-Math.pow(2,-10*k);
const seg=(t,a,b)=>cl((t-a)/(b-a),0,1);
const fade=(t,t0,d=0.5)=>t0==null?0:outExpo(seg(t,t0,t0+d));
const hash=i=>{let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function F(w,px){return `${w} ${px}px G`;}
function fitPx(txt,wt,maxW,cap){X.font=F(wt,cap);const w=X.measureText(txt).width;return w>maxW?Math.floor(cap*maxW/w):cap;}

// ─── Geometría: celdas y reparto de capítulos ───
const COL=c=>250+c*1480;                        // columnas de 950 de contenido
const ROWY=[375,1565,2715];                     // techo de contenido de cada fila
// celda [col,fila] de cada capítulo (deco en (2,0) y (3,2)):
const CELLS=[[0,0],[3,1],[1,0],[4,2],[2,1],[0,2],[3,0],[1,2],[4,0],[0,1],[4,1],[1,1],[2,2]];
const ORG=i=>[COL(CELLS[i][0]),ROWY[CELLS[i][1]]];
// caja protagonista (offsets sobre la celda), zoom y cifra por capítulo:
const ZSPEC=[
  {s:1.12, off:[0,0,950,717],  big:380},
  {s:1.30, off:[0,0,950,620],  big:300},
  {s:1.15, off:[0,0,1040,695], big:250},
  {s:1.15, off:[0,0,950,705],  big:320},
  {s:1.15, off:[0,0,950,690],  big:300},
  {s:1.15, off:[0,0,950,710],  big:320},
  {s:1.15, off:[0,-15,950,685],big:0},          // big = winnerPx (medido)
  {s:1.25, off:[0,0,950,650],  big:null},       // sankey
  {s:1.25, off:[0,0,950,630],  big:null},
  {s:1.25, off:[0,0,950,645],  big:340},
  {s:1.15, off:[0,0,950,710],  big:280},
  {s:1.15, off:[0,0,950,705],  big:260},
  {s:1.30, off:[0,55,0,575],   big:null},       // cierre: ancho = footerW (medido)
];
let STOPC=[];
function buildStops(){
  STOPC=ZSPEC.map((z,i)=>{
    const[x0,y0]=ORG(i), s=z.s;
    const bx0=x0+z.off[0], by0=y0+z.off[1];
    const bx1=i===12?x0+MEAS.footerW+30:x0+z.off[2], by1=y0+z.off[3];
    const cx=cl((bx0+bx1)/2,960/s,PW-960/s);
    const cy=((by1-(CAP_TOP-540)/s)+(by0+(540-MARGIN)/s))/2;
    return {cx,cy,s,box:[bx0,by0,bx1,by1],big:i===6?MEAS.winnerPx:z.big};
  });
}
const MINTEXT=40;                               // px de muro del texto legible más chico
const WALLK={x:PW/2,y:PH/2,s:Math.min(1920/PW,1080/PH)*0.957};

let CAM=[],WIPES=[];
const WIPE_AT=[1,6];                            // paneles que barren (ref canvas & frames)
function buildCam(){
  CAM=[];WIPES=[];
  const holds=[];
  E.chapters.forEach((ch,i)=>{
    const k=STOPC[i];
    const a={t:Math.max(0,ch.start-0.2),x:k.cx,y:k.cy,s:k.s},
          b={t:i===12?ch.end-2.6:ch.end+0.5,x:k.cx,y:k.cy,s:k.s};
    holds.push([a,b]);CAM.push(a,b);
  });
  // desvíos: arco perpendicular al salto + zoom-out según la distancia (todo desordenado)
  for(let i=0;i<12;i++){const a=holds[i][1],b=holds[i+1][0];
    const dx=b.x-a.x,dyv=b.y-a.y,d=Math.hypot(dx,dyv)||1;
    const px=-dyv/d,py=dx/d;
    const amp=(i%2?-1:1)*cl(d*0.13,80,420);
    const s2=Math.min(a.s,b.s)-(0.10+Math.min(0.30,d/7500));
    CAM.push({t:(a.t+b.t)/2,
      x:cl((a.x+b.x)/2+px*amp,960/s2,PW-960/s2),
      y:cl((a.y+b.y)/2+py*amp,540/s2,PH-540/s2), s:s2});
    if(WIPE_AT.includes(i))WIPES.push([a.t+0.1,b.t-0.1]);}
  CAM.push({t:E.chapters[12].end+0.4,...WALLK});
  CAM.push({t:LEN,...WALLK});
  CAM.sort((a,b)=>a.t-b.t);
}
function cam(t){
  let i=0; while(i<CAM.length-1&&CAM[i+1].t<=t)i++;
  if(i>=CAM.length-1)return CAM[CAM.length-1];
  const a=CAM[i],b=CAM[i+1],k=ss(seg(t,a.t,b.t));
  return {x:lp(a.x,b.x,k),y:lp(a.y,b.y,k),s:lp(a.s,b.s,k)};
}

// ─── Utilidades ───
function chip(x,y,txt,px,fill,pad=16,rot=0){
  X.save();X.translate(x,y);X.rotate(rot);X.font=F(500,px);
  const w=X.measureText(txt).width+pad*2,h=px+pad*1.2;
  if(fill){X.fillStyle=INK;X.fillRect(0,-h/2,w,h);X.fillStyle=BG;}
  else{X.strokeStyle=PAPER;X.lineWidth=2;X.strokeRect(0,-h/2,w,h);X.fillStyle=PAPER;}
  X.textBaseline='middle';X.fillText(txt,pad,2);X.restore();return w;
}
function mono(x,y,txt,px,col,tracking=0.1){
  X.font=F(500,px);X.fillStyle=col;X.textBaseline='alphabetic';
  let cx=x;for(const ch of txt){X.fillText(ch,cx,y);cx+=X.measureText(ch).width+px*tracking;}
  return cx-x;
}
// letras una a una con opacidad escalonada (ref transiciones letras, "Now")
function stagText(x,y,txt,px,wt,col,k,each=0.055){
  X.font=F(wt,px);X.fillStyle=col;let cx=x;
  for(let i=0;i<txt.length;i++){
    X.globalAlpha=ss(seg(k,i*each,i*each+0.3));
    X.fillText(txt[i],cx,y);cx+=X.measureText(txt[i]).width;
  }X.globalAlpha=1;return cx-x;
}
// caracteres que caen y se asientan en el dato (ref transiciones para las fechas)
function rainText(x,y,txt,px,wt,col,k,each=0.05){
  X.font=F(wt,px);X.fillStyle=col;let cx=x;
  for(let i=0;i<txt.length;i++){
    const ki=ss(seg(k,i*each,i*each+0.4));
    X.globalAlpha=ki;
    X.fillText(txt[i],cx,y-(1-ki)*(70+hash(i+x)*120));
    cx+=X.measureText(txt[i]).width;
  }X.globalAlpha=1;return cx-x;
}
function checker(x,y,n,sz){for(let i=0;i<n;i++)for(let j=0;j<2;j++)if((i+j)%2===0){X.fillStyle=PAPER;X.fillRect(x+i*sz,y+j*sz,sz,sz);}}
function dots(x,y,cols,rows,gap,r,col){X.fillStyle=col;for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){X.beginPath();X.arc(x+i*gap,y+j*gap,r,0,7);X.fill();}}
function trackXY(p,bx,by,bw,bh){return [bx+p[0]*bw, by+p[1]*bh];}
// guía punteada con manijas (ref canvas & frames): marca dónde aterrizará un dato
function ghost(x,y,w,h,k){if(k<=0.01)return;
  X.save();X.globalAlpha=k*0.55;X.strokeStyle=DIM;X.lineWidth=2;X.setLineDash([14,10]);
  X.strokeRect(x,y,w,h);X.setLineDash([]);X.fillStyle=DIM;
  for(const[hx,hy] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]])X.fillRect(hx-7,hy-7,14,14);
  X.restore();}
const cue=n=>E.cue[n];

// ─── El muro ───
function drawWall(t){
  const bt=t/BEAT;
  X.fillStyle=BG;X.fillRect(0,0,PW,PH);
  X.save();X.beginPath();X.rect(0,0,PW,PH);X.clip();X.textBaseline='alphabetic';

  // bandas globales + celdas deco (solo se ven en el reveal y las transiciones)
  mono(250,190,'PADDOCKINTEL RACE REPORT',44,DIM);
  mono(6480,190,T.header_right,44,PAPER);
  X.strokeStyle=DIM;X.lineWidth=2;
  X.beginPath();X.moveTo(250,1330);X.lineTo(7450,1330);X.stroke();
  X.beginPath();X.moveTo(250,2500);X.lineTo(7450,2500);X.stroke();
  checker(250,1235,24,36);dots(7280,1225,4,3,30,6,DIM);
  checker(250,2405,24,36);dots(7280,2395,4,3,30,6,DIM);
  // celda deco (2,0): el sello del GP
  X.font=F(900,150);X.strokeStyle=DIM;X.lineWidth=3;X.strokeText(T.deco_outline,3140,830);
  checker(3140,900,20,36);dots(4120,480,3,6,36,6,DIM);
  // celda deco (3,2): textura
  checker(4750,2850,24,40);dots(4750,3080,12,5,44,6,DIM);
  X.strokeStyle=DIM;X.lineWidth=2;X.strokeRect(4750,3350,860,70);
  checker(250,3960,24,36);
  mono(1400,3996,T.deco_footer,40,DIM);
  // relleno de los pasillos entre zonas (que no quede negro vacío en las paradas)
  for(const gx of [130,1465,2945,4425,5905,7410]){
    dots(gx,470,1,11,60,5,DIM);dots(gx,1640,1,10,60,5,DIM);dots(gx,2810,1,10,60,5,DIM);
    X.strokeStyle=DIM;X.lineWidth=1;X.globalAlpha=0.5;
    X.beginPath();X.moveTo(gx-40,440);X.lineTo(gx-40,1150);X.moveTo(gx+40,440);X.lineTo(gx+40,1150);
    X.moveTo(gx-40,1610);X.lineTo(gx-40,2270);X.moveTo(gx+40,1610);X.lineTo(gx+40,2270);
    X.moveTo(gx-40,2740);X.lineTo(gx-40,3420);X.moveTo(gx+40,2740);X.lineTo(gx+40,3420);X.stroke();X.globalAlpha=1;
  }

  // esqueleto del muro: cada celda marcada desde el frame 0 (blueprint que se llena)
  E.chapters.forEach((ch,i)=>{
    const[cx0,cy0]=ORG(i), z=ZSPEC[i];
    const k=0.55*(1-ss(seg(t,ch.start-1.0,ch.start-0.3)));
    if(k<=0.01)return;
    X.save();X.globalAlpha=k;X.strokeStyle=DIM;X.lineWidth=2;X.setLineDash([18,14]);
    X.strokeRect(cx0,cy0,i===12?MEAS.footerW+30:z.off[2],z.off[3]);
    X.setLineDash([]);X.fillStyle=DIM;
    X.fillRect(cx0-6,cy0-6,12,12);X.fillRect(cx0+(i===12?MEAS.footerW+30:z.off[2])-6,cy0+z.off[3]-6,12,12);
    mono(cx0+24,cy0+86,String(i+1).padStart(2,'0'),60,DIM,0.08);
    X.restore();
  });

  let x0,y0;
  // ── Z1 · HOOK — ref storytelling: crop extremo como portada ──
  [x0,y0]=ORG(0);
  mono(x0,y0+25,T.z1_top,40,PAPER);
  chip(x0+650,y0+80,T.hook_chip,40,true,16,-0.05);
  X.font=F(900,380);X.fillStyle=PAPER;X.fillText(T.hook_big,x0,y0+425);
  X.font=F(900,230);X.fillStyle=INK;X.globalAlpha=0.25+0.75*fade(t,cue('hook_p2'));X.fillText(T.hook_to,x0+20,y0+635);X.globalAlpha=1;
  mono(x0,y0+665,T.hook_sub1,40,PAPER);
  mono(x0,y0+717,T.hook_sub2,40,DIM);

  // ── Z2 · THE RACE — ref track animation: pista neón al compás + stats rotando ──
  [x0,y0]=ORG(1);
  X.globalAlpha=fade(t,E.chapters[1].start-1.4);mono(x0,y0+25,'THE RACE',40,DIM);X.globalAlpha=1;
  const tb={x:x0,y:y0+75,w:540*S.track.aspect,h:540};
  const drawK=ss(seg(t,E.chapters[1].start-2.2,E.chapters[1].start+0.1));
  const pts=S.track.pts,n=Math.max(2,Math.floor(pts.length*drawK));
  const pulse=Math.pow(1-(bt%1),2.2)*(drawK>=1?1:0);
  X.save();X.lineJoin='round';X.lineCap='round';
  for(const [lw,col,blur,al] of [[22,INK,36+pulse*30,0.16+pulse*0.1],[10,INK,16,0.55],[4,'#FFF4CC',0,1]]){
    X.beginPath();for(let i=0;i<n;i++){const[px,py]=trackXY(pts[i],tb.x,tb.y,tb.w,tb.h);i?X.lineTo(px,py):X.moveTo(px,py);}
    if(drawK>=1)X.closePath();
    X.strokeStyle=col;X.lineWidth=lw;X.shadowColor=INK;X.shadowBlur=blur;X.globalAlpha=al;X.stroke();X.shadowBlur=0;X.globalAlpha=1;}
  if(drawK>=1){const f=(t/BAR)%1,i0=Math.floor(f*pts.length);
    X.beginPath();for(let k=0;k<22;k++){const[px,py]=trackXY(pts[(i0+k)%pts.length],tb.x,tb.y,tb.w,tb.h);k?X.lineTo(px,py):X.moveTo(px,py);}
    X.strokeStyle='#FFF';X.lineWidth=8;X.shadowColor='#FFF';X.shadowBlur=22;X.globalAlpha=0.9;X.stroke();X.shadowBlur=0;X.globalAlpha=1;}
  X.restore();
  const sCues=[cue('s71'),cue('srain'),cue('ssc')];
  let sIdx=-1;for(let i=0;i<3;i++)if(t>=sCues[i])sIdx=i;
  if(sIdx>=0){const roll=ss(seg(t,sCues[sIdx],sCues[sIdx]+0.4));
    X.save();X.beginPath();X.rect(x0+420,y0+55,530,565);X.clip();
    for(const[idx,prev]of [[sIdx,0],[sIdx-1,1]]){ if(idx<0)continue; if(prev&&roll>=1)continue;
      const off=prev?-420*roll:420*(1-roll);
      const st=T.stats[idx],vPx=st[0].length<=2?300:150;
      X.font=F(900,vPx);X.fillStyle=INK;X.fillText(st[0],x0+440,y0+375+off);
      mono(x0+445,y0+447+off,st[1],42,PAPER);
      if(idx===2&&t>=cue('svsc'))mono(x0+445,y0+502+off,T.stat_vsc,42,PAPER);
    }
    X.restore();}

  // ── Z3 · THE START — ref cube transition: banner y tarjetas giran como caras de cubo ──
  [x0,y0]=ORG(2);
  X.globalAlpha=fade(t,E.chapters[2].start-0.6);mono(x0,y0+25,'THE START · LAP 1',40,DIM);X.globalAlpha=1;
  const kPole=fade(t,cue('pole')),kFlip=ss(seg(t,cue('p3'),cue('p3')+0.5));
  if(kPole>0){X.save();X.globalAlpha=kPole;X.translate(x0,y0+75);
    const fl=Math.abs(1-2*kFlip);X.scale(1,Math.max(0.03,fl));
    X.fillStyle=kFlip<0.5?INK:'#1A1A1E';X.fillRect(0,0,1040,128);
    X.font=F(900,56);X.fillStyle=kFlip<0.5?BG:PAPER;X.textBaseline='middle';
    X.fillText(kFlip<0.5?T.start_pole:T.start_fell,24,66);X.textBaseline='alphabetic';X.restore();}
  const cards=[[T.start_c1,cue('c_ant'),true],[T.start_c2,cue('c_law'),false],[T.start_c3,cue('p3'),false]];
  const g3=fade(t,E.chapters[2].start-0.6);
  cards.forEach((cd,i)=>ghost(x0+i*355,y0+255,330,440,g3*(1-ss(seg(t,cd[1],cd[1]+0.35)))));
  cards.forEach(([txt,t0,hero],i)=>{const k=ss(seg(t,t0,t0+0.55));if(k<=0)return;
    const cx=x0+i*355, cy=y0+255;
    X.save();X.translate(cx+165,cy+220);X.scale(Math.max(0.03,k),1);X.translate(-165,-220); // cara de cubo
    if(hero){X.fillStyle=INK;X.fillRect(0,0,330,440);}else{X.strokeStyle=PAPER;X.lineWidth=3;X.strokeRect(0,0,330,440);}
    const nPx=fitPx('P'+(i+1),900,302,250);
    X.font=F(900,nPx);X.fillStyle=hero?BG:PAPER;X.fillText('P'+(i+1),14,290);
    X.font=F(500,44);X.fillStyle=hero?BG:PAPER;X.fillText(txt,14,390);X.restore();});

  // ── Z4 · THE LEAD — ref transiciones letras (texto escalonado) + filmstrip 1–71 ──
  [x0,y0]=ORG(3);
  X.globalAlpha=fade(t,E.chapters[3].start-0.6);mono(x0,y0+25,'THE LEAD',40,DIM);X.globalAlpha=1;
  const g4=fade(t,E.chapters[3].start-0.6);
  T.lead_chips.forEach((lc,i)=>ghost(x0+(i%2)*500,y0+90+Math.floor(i/2)*95-38,460,76,g4*(1-ss(seg(t,cue('lead'+i),cue('lead'+i)+0.35)))));
  ghost(x0,y0+325,430,265,g4*(1-ss(seg(t,cue('led48'),cue('led48')+0.35))));
  ghost(x0,y0+625,950,60,g4*(1-ss(seg(t,cue('lead0'),cue('lead0')+0.35))));
  T.lead_chips.forEach((lc,i)=>{const t0=cue('lead'+i),k=fade(t,t0,0.45);if(k<=0)return;
    const cx=x0+(i%2)*500, cy=y0+90+Math.floor(i/2)*95;
    X.globalAlpha=k;X.save();X.translate(cx,cy);
    X.font=F(500,46);const w=X.measureText(lc).width+32,h=46*1.65;
    if(i===3){X.fillStyle=INK;X.fillRect(0,-h/2,w,h);}else{X.strokeStyle=PAPER;X.lineWidth=2;X.strokeRect(0,-h/2,w,h);}
    X.textBaseline='middle';X.restore();
    X.save();X.translate(cx+16,cy);X.textBaseline='middle';
    stagText(0,2,lc,46,500,i===3?BG:PAPER,seg(t,t0,t0+0.9));
    X.restore();X.textBaseline='alphabetic';X.globalAlpha=1;});
  const kled=fade(t,cue('led48'));
  if(kled>0){X.globalAlpha=kled;
    X.font=F(900,320);X.fillStyle=INK;X.fillText(T.led_big,x0,y0+575);
    mono(x0+470,y0+495,T.led_label,44,PAPER);X.globalAlpha=1;}
  X.globalAlpha=fade(t,cue('led23'));mono(x0+470,y0+560,T.led_small,44,DIM);X.globalAlpha=1;
  const segs=T.lead_segments;
  const fsX=l=>x0+(l-1)/70*950;
  segs.forEach((sg,i)=>{const k=fade(t,cue('lead'+i),0.5);if(k<=0)return;
    const[a,b,code]=sg,xa=fsX(a),xb=fsX(b)+950/70;
    X.globalAlpha=k;X.fillStyle=i%2?INK:'#1A1A1E';X.fillRect(xa,y0+625,xb-xa,60);
    X.strokeStyle=BG;X.lineWidth=3;X.strokeRect(xa,y0+625,xb-xa,60);
    if(xb-xa>130){X.font=F(500,40);X.fillStyle=i%2?BG:DIM;X.textBaseline='middle';X.fillText(code,xa+14,y0+657);X.textBaseline='alphabetic';}
    X.globalAlpha=1;});
  if(fade(t,cue('lead0'))>0){X.globalAlpha=fade(t,cue('lead0'));
    mono(x0,y0+703,'L1',38,DIM,0.02);mono(x0+900,y0+703,'L71',38,DIM,0.02);X.globalAlpha=1;}

  // ── Z5 · THE TYRES — ref canvas & frames: una tarjeta bento por stint ──
  [x0,y0]=ORG(4);
  X.globalAlpha=fade(t,E.chapters[4].start-0.6);mono(x0,y0+25,'THE TYRES · PIT STOPS',40,DIM);X.globalAlpha=1;
  const tyCues=[cue('ty1'),cue('ty17'),cue('ty63')];
  const g5=fade(t,E.chapters[4].start-0.6);
  tyCues.forEach((t0,i)=>ghost(x0+i*330,y0+85,290,310,g5*(1-ss(seg(t,t0,t0+0.35)))));
  T.stint_cards.forEach((sc,i)=>{const k=ss(seg(t,tyCues[i],tyCues[i]+0.55));if(k<=0)return;
    const cx=x0+i*330, dir=i%2?1:-1;
    X.save();X.globalAlpha=k;X.translate(cx+dir*220*(1-k),y0+85);   // entran deslizando, alternadas

function rain(t,amt){
  if(amt<=0)return;
  X.save();X.strokeStyle=PAPER;X.lineWidth=2;
  for(let i=0;i<110;i++){
    if(hash(i*3.7)>amt)continue;
    const sx=hash(i)*W*1.2-W*0.1, len=80+hash(i+50)*150, sp=1300+hash(i+99)*900;
    const y=((hash(i+7)*H*2+t*sp)%(H+len))-len;
    X.globalAlpha=0.04+hash(i+13)*0.07;
    X.beginPath();X.moveTo(sx,y);X.lineTo(sx-len*0.18,y+len);X.stroke();
  }
  X.restore();
}
function captions(t){
  const cap=E.captions.find(cp=>t>=cp.t0&&t<cp.t1);
  if(!cap)return;
  X.save();let px=92;X.font=F(500,px);X.textBaseline='middle';
  let w=X.measureText(cap.text).width;
  if(w>W-140){px=Math.floor(92*(W-140)/w);X.font=F(500,px);w=X.measureText(cap.text).width;}
  const x=(W-w)/2,y=H-105,bh=px*1.63;
  X.globalAlpha=0.78;X.fillStyle=BG;X.fillRect(x-30,y-bh/2,w+60,bh);X.globalAlpha=1;
  X.fillStyle=PAPER;X.fillText(cap.text,x,y+3);
  X.restore();X.textBaseline='alphabetic';
}

}

function wipes(t){
  for(const [a,b] of WIPES){
    if(t<=a||t>=b)continue;

    const px=lp(W*1.25,-W*1.65,k);

}

    const x0=(b[0]-k.x)*s+W/2, x1=(b[2]-k.x)*s+W/2;
    const y0=(b[1]-k.y)*s+H/2, y1=(b[3]-k.y)*s+H/2;
    const bw=x1-x0, bh=y1-y0;
    const bad=why=>fails.push({stop:'cap'+(i+1),t:Math.round(t*10)/10,why});
    if(x0<m-1||x1>W-m+1||y0<m-1)bad(`caja fuera de márgenes: [${[x0,y0,x1,y1].map(Math.round)}]`);
    if(y1>CAP_TOP+1)bad(`caja invade la banda de subtítulos: y1=${Math.round(y1)} > ${CAP_TOP}`);
    if(bw<W*0.6-1&&bh<H*0.5-1)bad(`bloque chico: ${Math.round(bw/W*100)}% ancho, ${Math.round(bh/H*100)}% alto (pide ≥60% o ≥50%)`);
    if(st.big!=null&&st.big*s<280-0.5)bad(`cifra protagonista ${Math.round(st.big*s)}px < 280px`);
    if(MINTEXT*s<44-0.5)bad(`texto mínimo ${Math.round(MINTEXT*s)}px < 44px`);
  });
  return fails;
};
window.stopTimes=()=>E.chapters.map((ch,i)=>(Math.max(0,ch.start-0.2)+(i===12?ch.end-2.6:ch.end+0.5))/2).concat([LEN-2.5]);

window.still=function(w,h){
  c.width=W=w;c.height=H=h;
  X.setTransform(1,0,0,1,0,0);X.fillStyle=WALL;X.fillRect(0,0,w,h);
  const s=Math.min(w/PW,h/PH)*0.96;
  X.setTransform(s,0,0,s,(w-PW*s)/2,(h-PH*s)/2);
  drawWall(LEN);
  X.setTransform(1,0,0,1,0,0);
};

const fontsReady=Promise.all([F(900,100),F(500,30)].map(f=>document.fonts.load(f)));
fontsReady.then(async()=>{
  const qs=new URLSearchParams(location.search);
  if(!window.STORY&&qs.get('story')){try{window.STORY=await(await fetch(qs.get('story'))).json();}catch(e){}}
  if(!window.STORY){document.body.innerHTML='<p style="color:#888;font-family:sans-serif">Falta STORY</p>';return;}
  S=window.STORY;T=S.texts;E=S.episode;BEAT=60/(S.bpm||106.06);BAR=BEAT*4;LEN=S.seconds;
  LASTCAP=Math.max(...E.captions.map(cp=>cp.t1));
  MEAS.winnerPx=Math.min(fitPx(T.winner_big[0],900,950,245),fitPx(T.winner_big[1],900,950,245));
  MEAS.footerPx=Math.min(fitPx(T.footer_lines[0],900,1150,150),fitPx(T.footer_lines[1],900,1150,150));
  X.font=F(900,MEAS.footerPx);
  MEAS.footerW=Math.max(X.measureText(T.footer_lines[0]).width,X.measureText(T.footer_lines[1]).width);
  buildStops();buildCam();
  window.ready=true;draw(0);
  if(qs.get('play')){const t0=performance.now();(function loop(){draw(((performance.now()-t0)/1000)%LEN);requestAnimationFrame(loop);})();}
});
</script></body></html>
